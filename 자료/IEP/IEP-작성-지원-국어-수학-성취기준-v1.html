<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IEP 작성 지원 — 국어·수학 성취기준·평가기준 (1~6학년)</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1f2937; --ink-soft:#6b7280;
    --line:#e5e7eb; --accent:#2f6f6a; --accent-soft:#e4efee;
    --amber:#8a6d3b; --amber-soft:#f6efe2; --danger:#b3423a;
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.65; padding:24px 16px 80px;
  }
  .wrap{max-width:880px; margin:0 auto;}
  header{margin-bottom:18px;}
  header h1{font-size:1.35rem; font-weight:800; letter-spacing:-0.02em;}
  header p{color:var(--ink-soft); font-size:0.88rem; margin-top:4px;}
  .toolbar{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .tabs{display:flex; gap:0; border-bottom:2px solid var(--line); margin-bottom:16px;}
  .tab{
    padding:10px 18px; font-size:0.95rem; font-weight:700; cursor:pointer;
    color:var(--ink-soft); border:none; background:none; border-bottom:3px solid transparent;
    margin-bottom:-2px; font-family:inherit;
  }
  .tab:hover{color:var(--accent);}
  .tab.active{color:var(--accent); border-bottom-color:var(--accent);}
  .subjects{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .subject-btn{
    flex:1; min-width:110px; padding:12px 8px; border:1px solid var(--line);
    background:var(--card); border-radius:var(--radius); font-size:0.95rem; font-weight:700;
    cursor:pointer; color:var(--ink); transition:all .15s; font-family:inherit;
  }
  .subject-btn:hover{border-color:var(--accent);}
  .subject-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .level-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .chip{
    padding:8px 16px; border:1px solid var(--line); background:var(--card);
    border-radius:999px; cursor:pointer; font-size:0.9rem; font-weight:600; transition:all .15s;
    font-family:inherit;
  }
  .chip:hover{border-color:var(--accent);}
  .chip.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
  .chip.empty{opacity:.4; cursor:default;}
  .chip.empty:hover{border-color:var(--line);}
  .level-label{font-size:0.78rem; font-weight:700; color:var(--ink-soft); margin:14px 0 6px; letter-spacing:.06em;}
  #unitDetail{margin-top:22px;}
  .unit-title{
    font-size:1.15rem; font-weight:800; padding:14px 18px; background:var(--accent);
    color:#fff; border-radius:var(--radius); margin-bottom:14px;
  }
  .section-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    margin-bottom:14px; overflow:hidden;
  }
  .section-head{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:12px 16px; border-bottom:1px solid var(--line); background:#fafbfc;
  }
  .section-head h3{font-size:0.98rem; font-weight:800; color:var(--accent);}
  .btn-group{display:flex; gap:6px; flex-shrink:0; flex-wrap:wrap;}
  .btn{
    padding:6px 12px; font-size:0.8rem; font-weight:600; border-radius:7px;
    border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--ink); transition:all .15s;
    font-family:inherit;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{opacity:.88; color:#fff;}
  .btn.danger:hover{border-color:var(--danger); color:var(--danger);}
  .btn.copied{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
  .section-body{padding:14px 16px; white-space:pre-wrap; font-size:0.92rem;}
  .students{border-top:1px dashed var(--line); background:#fffdf8; padding:10px 16px 14px;}
  .students-label{font-size:0.76rem; font-weight:700; color:var(--amber); margin-bottom:8px;}
  .student-block{border:1px solid #ecdfc6; border-radius:8px; margin-bottom:8px; overflow:hidden; background:#fff;}
  .student-head{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 12px; cursor:pointer; background:var(--amber-soft); user-select:none;
  }
  .student-head:hover{filter:brightness(.98);}
  .student-name{font-size:0.88rem; font-weight:700; color:var(--amber);}
  .student-count{font-size:0.75rem; color:var(--amber); opacity:.8;}
  .student-body{display:none; padding:10px 12px;}
  .student-block.open .student-body{display:block;}
  .rev-item{
    border:1px solid #eee3cf; background:#fdfaf3; border-radius:8px;
    padding:10px 12px; margin-bottom:8px;
  }
  .rev-meta{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; flex-wrap:wrap;}
  .rev-date{font-size:0.74rem; color:var(--amber); font-weight:600;}
  .rev-text{white-space:pre-wrap; font-size:0.88rem;}
  .rev-empty{font-size:0.82rem; color:var(--ink-soft); margin-bottom:8px;}
  .modal-back{
    display:none; position:fixed; inset:0; background:rgba(20,24,28,.45); z-index:50;
    align-items:center; justify-content:center; padding:16px;
  }
  .modal-back.open{display:flex;}
  .modal{
    background:#fff; border-radius:14px; width:100%; max-width:680px; max-height:88vh;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .modal-head{padding:14px 18px; border-bottom:1px solid var(--line); font-weight:800;}
  .modal textarea{
    flex:1; min-height:300px; margin:14px 18px; padding:12px; font-family:inherit;
    font-size:0.92rem; line-height:1.6; border:1px solid var(--line); border-radius:8px; resize:vertical;
  }
  .modal-foot{padding:12px 18px 16px; display:flex; justify-content:flex-end; gap:8px;}
  .name-list{padding:14px 18px; overflow-y:auto;}
  .name-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .name-row input{
    flex:1; padding:9px 12px; border:1px solid var(--line); border-radius:8px;
    font-family:inherit; font-size:0.92rem;
  }
  .name-row input:focus{outline:none; border-color:var(--accent);}
  .name-hint{font-size:0.8rem; color:var(--ink-soft); padding:0 18px 4px;}
  .empty-note{color:var(--ink-soft); font-size:0.88rem; padding:20px 4px;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-size:0.85rem;
    opacity:0; pointer-events:none; transition:opacity .25s; z-index:99;
  }
  .toast.show{opacity:1;}
  @media (max-width:600px){
    .section-head{flex-direction:column; align-items:flex-start;}
    .tab{padding:10px 10px; font-size:0.85rem;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>개별화교육계획(IEP) 작성 지원 프로그램</h1>
    <p>교육과정 → 과목 → 학년(군) → 단원을 선택하세요. 성취기준과 평가기준은 학생별로 수정본을 만들 수 있습니다.</p>
    <div class="toolbar">
      <button class="btn primary" onclick="openNameModal()">학생 이름 관리</button>
      <button class="btn" onclick="exportEdits()">수정 내용 내보내기(백업)</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">수정 내용 가져오기</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importEdits(event)">
    </div>
  </header>
  <div class="tabs" id="tabRow"></div>
  <div class="subjects" id="subjectRow"></div>
  <div id="gradeArea"></div>
  <div id="semesterArea"></div>
  <div id="unitArea"></div>
  <div id="unitDetail"></div>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <div class="modal-head" id="modalTitle">수정 후 저장</div>
    <textarea id="modalText"></textarea>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn primary" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<div class="modal-back" id="nameBack">
  <div class="modal">
    <div class="modal-head">학생 이름 관리</div>
    <div class="name-hint">이름을 바꿔도 각 학생의 수정본은 그대로 유지됩니다. 실명·가명·기호 모두 사용할 수 있습니다.</div>
    <div class="name-list" id="nameList"></div>
    <div class="modal-foot">
      <button class="btn" onclick="addStudentRow()">+ 학생 추가</button>
      <button class="btn" onclick="closeNameModal()">취소</button>
      <button class="btn primary" onclick="saveNames()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DEFAULT_STUDENTS = [
  {id:"s1", name:"가"}, {id:"s2", name:"나"}, {id:"s3", name:"다"},
  {id:"s4", name:"라"}, {id:"s5", name:"마"}, {id:"s6", name:"바"},
  {id:"s7", name:"사"}
];
let STUDENTS = [];

const TABS = ["일반교육과정","특수교육 교육과정","일상생활","행동지원"];
const TAB_CONFIG = {
  "일반교육과정": {
    subjects: ["국어","수학"],
    grades: ["1학년","2학년","3학년","4학년","5학년","6학년"],
    gradeLabel: "학년",
    hasSemester: true
  },
  "특수교육 교육과정": {
    subjects: ["국어","수학"],
    grades: ["1~2학년군","3~4학년군","5~6학년군"],
    gradeLabel: "학년군",
    hasSemester: false
  },
  "일상생활": {
    subjects: ["신체활동","여가활동","의사소통","자립생활"],
    grades: [],
    gradesFromData: true,
    gradeLabel: "영역",
    hasSemester: false
  },
  "행동지원": {
    subjects: ["요구·획득 기능","회피·도피 기능","관심 끌기 기능","감각·자기조절 기능","기초 양식"],
    grades: [],
    gradeLabel: "",
    hasGrade: false,
    hasSemester: false
  }
};
const SEMESTERS = ["1학기","2학기"];
const SECTION_ORDER = ["성취기준","단원 목표","차시별 목표","교육 내용","평가기준","행동 정의 및 기능","기능적 행동평가(FBA) 예시","행동지원계획(BIP) 예시","행동 목표 예시"];
const SECTION_MODE = {
  "성취기준":"student",
  "단원 목표":"unit",
  "차시별 목표":"plain",
  "교육 내용":"plain",
  "평가기준":"student",
  "행동 정의 및 기능":"plain",
  "기능적 행동평가(FBA) 예시":"unit",
  "행동지원계획(BIP) 예시":"student",
  "행동 목표 예시":"student"
};

const DATA = {
  "일반교육과정": {
    "국어": {
      "1학년": {
        "1학기": {
          "한글 놀이 단원. 한글 놀이마당": {
            "성취기준":
`[2국04-01] 한글 자모의 이름과 소릿값을 알고 정확하게 발음하고 쓴다.
(관련) [2국01-03] 상대의 말을 집중하여 듣고 말차례를 지키며 대화한다.
(관련) [2국02-05] 읽기에 흥미를 가지고 즐겨 읽는 태도를 지닌다.`,
            "단원 목표":
`한글 놀이를 하며 글자를 익힌다.

○ 특화 단원(34차시 기본) — 입학 초기 적응 활동 기간에 놀이로 한글 학습의 기초를 다지는 단원. 학생들의 상황에 따라 탄력적으로 운영 가능
○ 글자 놀이 → 모음자 놀이 → 자음자 놀이의 세 마당이 하나의 이야기로 연결됨`,
            "차시별 목표":
`배울 내용을 살펴볼 수 있다.
여러 가지 선을 그을 수 있다.
모양이 같은 그림을 찾을 수 있다.
글자 모양을 찾을 수 있다.
소리마디를 구분할 수 있다.
말놀이를 할 수 있다.
모음자를 안다.
모음자 놀이를 할 수 있다.
모음자를 바르게 읽고 쓸 수 있다.
자음자를 안다.
자음자를 더 안다.
자음자를 바르게 쓸 수 있다.
자음자 놀이를 할 수 있다.
배운 내용을 실천할 수 있다.
배운 내용을 마무리할 수 있다.`,
            "교육 내용":
`첫째 마당: 글자 놀이
여러 가지 선 긋기(소근육 강화) / 모양이 같은 그림 찾기(시각적 변별) / 글자 모양 찾기 / 소리마디 구분하기(청각적 변별) / 말놀이하기(소리마디 수가 같은 낱말 이어 말하기)

둘째 마당: 모음자 놀이
모음자 알기 / 모음자 놀이 하기(몸으로 모음자 만들기) / 모음자 바르게 읽고 쓰기

셋째 마당: 자음자 놀이
자음자 알기 / 자음자 더 알기 / 자음자 바르게 쓰기 / 자음자 놀이 하기(몸으로 자음자 만들기)

실천: 글자 없는 그림책을 보고 이야기 나누기`,
            "평가기준":
`글자인 것을 찾고, 시작하는 소리가 같은 낱말을 말하는가?
알맞은 모음자를 찾아 쓰는가?
자음자를 읽고 쓰는가?

평가방법: 놀이·활동 관찰 중심 — 글자인 것과 아닌 것 구별(문자 인식), 모음자 이름을 듣고 찾아 표시하기, 자음자를 순서에 맞게 쓰기 등을 색칠하기·○표 하기 같은 부담 없는 방식으로 평가`
          },
          "1단원. 글자를 만들어요": {
            "성취기준":
`[2국04-01] 한글 자모의 이름과 소릿값을 알고 정확하게 발음하고 쓴다.
[2국02-01] 글자, 단어, 문장, 짧은 글을 정확하게 소리 내어 읽는다.
[2국03-01] 글자와 단어를 바르게 쓴다.`,
            "단원 목표":
`받침이 없는 글자를 읽고 쓴다.`,
            "차시별 목표":
`배울 내용을 살펴볼 수 있다.
글자에서 자음자와 모음자를 찾을 수 있다.
받침이 없는 글자의 짜임을 안다.
바른 자세로 글자를 읽고 쓸 수 있다.
여러 가지 모음자를 안다.
배운 내용을 실천할 수 있다.
배운 내용을 마무리할 수 있다.`,
            "교육 내용":
`글자의 짜임 알기
글자에서 자음자와 모음자 찾기
받침이 없는 글자의 짜임 알기

받침이 없는 글자 읽고 쓰기
바른 자세로 글자 읽고 쓰기
여러 가지 모음자 알기`,
            "평가기준":
`낱말을 만들고 읽는가?
또박또박 읽는가?

평가방법:
① 받침이 없는 글자의 짜임을 이해하고 읽고 쓰는지 친숙한 낱말 중심 지필 평가(모음자 위치가 서로 다른 낱말 활용)
② 자모음자 이름 말하기, 의미 단어·무의미 단어 읽기 수행 평가 — 성취하지 못한 학생은 개별 지도로 글자와 소리를 대응하도록 지원(받침 있는 단어 읽기의 기초)`
          },
          "2단원. 받침이 있는 글자를 읽어요": {
            "성취기준":
`[2국04-01] 한글 자모의 이름과 소릿값을 알고 정확하게 발음하고 쓴다.
[2국03-01] 글자와 단어를 바르게 쓴다.
[2국01-04] 자신의 경험이나 생각을 바른 자세로 발표한다.`,
            "단원 목표":
`받침이 있는 글자를 읽는다.`,
            "차시별 목표":
`배울 내용을 살펴볼 수 있다.
받침이 있는 글자의 짜임을 안다.
받침이 있는 글자를 읽을 수 있다.
바른 자세로 발표할 수 있다.
다른 사람의 말을 집중해 들을 수 있다.
배운 내용을 실천할 수 있다.
배운 내용을 마무리할 수 있다.`,
            "교육 내용":
`받침이 있는 글자 읽기
받침이 있는 글자의 짜임 알기
받침이 있는 글자 읽기

바른 자세로 말하고 듣기
바른 자세로 발표하기
다른 사람의 말을 집중해 듣기`,
            "평가기준":
`받침이 있는 글자를 만들고 소리 내어 읽는가?
자기소개 내용을 떠올려 바른 자세로 발표하는가?

평가방법:
① 받침이 있는 글자의 짜임을 알고 소리 내어 읽고 쓰면 성취한 것으로 평가 — 짧은 글을 활용해 받침이 있는 낱말 읽고 쓰기
② 공식적인 말하기(발표)를 바른 자세로 하는지(교사 관찰, 자기 평가), 다른 사람의 말에 귀 기울이며 집중해 듣는지 평가`
          },
          "3단원. 낱말과 친해져요": {
            "성취기준":
`[2국03-01] 글자와 단어를 바르게 쓴다.
[2국02-01] 글자, 단어, 문장, 짧은 글을 정확하게 소리 내어 읽는다.
[2국04-01] 한글 자모의 이름과 소릿값을 알고 정확하게 발음하고 쓴다.`,

const memStore = {};
const KEY_EDITS = "curriculum-edits-v2";
const KEY_STUDENTS = "curriculum-students-v1";

async function storeGet(key){
  try{
    if(window.storage){
      try{
        const r = await window.storage.get(key);
        if(r && r.value) return JSON.parse(r.value);
      }catch(e){}
      return null;
    }
  }catch(e){}
  try{
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : null;
  }catch(e){}
  return memStore[key] || null;
}
async function storeSet(key, obj){
  const str = JSON.stringify(obj);
  try{ if(window.storage){ await window.storage.set(key, str); return; } }catch(e){}
  try{ localStorage.setItem(key, str); return; }catch(e){}
  memStore[key] = obj;
  toast("이 환경에서는 임시 저장만 됩니다 (새로고침 시 사라짐)");
}

let EDITS = {};
let sel = { tab:null, subject:null, grade:null, semester:null, unit:null };
const openStudents = new Set();

function cfg(){ return TAB_CONFIG[sel.tab] || {subjects:[],grades:[],hasSemester:false,gradeLabel:"학년"}; }
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}
function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function getUnits(){
  const c = cfg();
  if(c.hasGrade===false){
    return DATA[sel.tab]?.[sel.subject] || null;
  }
  const base = DATA[sel.tab]?.[sel.subject]?.[sel.grade];
  if(!base) return null;
  return c.hasSemester ? (sel.semester ? base[sel.semester] : null) : base;
}
function getUnit(){
  const units = getUnits();
  return units ? units[sel.unit] : null;
}

function renderTabs(){
  const row = document.getElementById("tabRow");
  row.innerHTML = "";
  TABS.forEach(t=>{
    const b = el("button","tab"+(sel.tab===t?" active":""), t);
    b.onclick = ()=>{ sel = {tab:t, subject:null, grade:null, semester:null, unit:null}; renderAll(); };
    row.appendChild(b);
  });
}
function renderSubjects(){
  const row = document.getElementById("subjectRow");
  row.innerHTML = "";
  if(!sel.tab) return;
  const subjects = cfg().subjects;
  if(subjects.length===0){
    row.appendChild(el("div","empty-note","이 영역의 자료는 아직 등록되지 않았습니다. 파일을 올려 주시면 구조를 함께 정해 추가합니다."));
    return;
  }
  subjects.forEach(s=>{
    const b = el("button","subject-btn"+(sel.subject===s?" active":""), s);
    b.onclick = ()=>{ sel.subject=s; sel.grade=null; sel.semester=null; sel.unit=null; renderAll(); };
    row.appendChild(b);
  });
}
function renderGrades(){
  const area = document.getElementById("gradeArea");
  area.innerHTML = "";
  if(!sel.subject || cfg().hasGrade===false) return;
  const gradeList = cfg().gradesFromData
    ? Object.keys(DATA[sel.tab]?.[sel.subject] || {})
    : cfg().grades;
  if(gradeList.length===0){
    area.appendChild(el("div","empty-note","이 과목의 자료는 아직 등록되지 않았습니다."));
    return;
  }
  area.appendChild(el("div","level-label",cfg().gradeLabel));
  const row = el("div","level-row");
  gradeList.forEach(g=>{
    const has = DATA[sel.tab]?.[sel.subject]?.[g];
    const c = el("button","chip"+(sel.grade===g?" active":"")+(has?"":" empty"), g);
    c.onclick = ()=>{ sel.grade=g; sel.semester=null; sel.unit=null; renderAll(); };
    row.appendChild(c);
  });
  area.appendChild(row);
}
function renderSemesters(){
  const area = document.getElementById("semesterArea");
  area.innerHTML = "";
  if(!sel.grade || !cfg().hasSemester) return;
  area.appendChild(el("div","level-label","학기"));
  const row = el("div","level-row");
  SEMESTERS.forEach(sm=>{
    const has = DATA[sel.tab]?.[sel.subject]?.[sel.grade]?.[sm];
    const c = el("button","chip"+(sel.semester===sm?" active":"")+(has?"":" empty"), sm);
    c.onclick = ()=>{ sel.semester=sm; sel.unit=null; renderAll(); };
    row.appendChild(c);
  });
  area.appendChild(row);
}
function renderUnits(){
  const area = document.getElementById("unitArea");
  area.innerHTML = "";
  if(cfg().hasGrade!==false && !sel.grade) return;
  if(cfg().hasSemester && !sel.semester) return;
  area.appendChild(el("div","level-label","단원"));
  const units = getUnits();
  if(!units || Object.keys(units).length===0){
    area.appendChild(el("div","empty-note","등록된 단원이 없습니다. 지도서를 올려 주시면 추가해 드립니다."));
    return;
  }
  const row = el("div","level-row");
  Object.keys(units).forEach(u=>{
    const c = el("button","chip"+(sel.unit===u?" active":""), u);
    c.onclick = ()=>{ sel.unit=u; renderAll(); };
    row.appendChild(c);
  });
  area.appendChild(row);
}
function unitKey(){
  const g = cfg().hasGrade===false ? "-" : sel.grade;
  return [sel.tab, sel.subject, g, (cfg().hasSemester ? sel.semester : "-"), sel.unit].join("|");
}

function renderDetail(){
  const box = document.getElementById("unitDetail");
  box.innerHTML = "";
  const unit = sel.unit ? getUnit() : null;
  if(!unit) return;
  const pathLabel = cfg().hasGrade===false
    ? `${sel.subject} · ${sel.unit}`
    : (cfg().hasSemester
      ? `${sel.subject} · ${sel.grade} ${sel.semester} · ${sel.unit}`
      : `${sel.subject} · ${sel.grade} · ${sel.unit}`);
  box.appendChild(el("div","unit-title", pathLabel));

  SECTION_ORDER.forEach(sec=>{
    if(!(sec in unit)) return;
    const mode = SECTION_MODE[sec] || "plain";
    const card = el("div","section-card");
    const head = el("div","section-head");
    head.appendChild(el("h3","",sec));
    if(mode==="unit"){
      const grp = el("div","btn-group");
      const copyBtn = el("button","btn","복사");
      copyBtn.onclick = ()=>copyText(unit[sec], copyBtn);
      const editBtn = el("button","btn primary","수정 후 저장");
      editBtn.onclick = ()=>openModal(sec, null, latestOrOriginal(sec, null, unit[sec]));
      grp.appendChild(copyBtn); grp.appendChild(editBtn);
      head.appendChild(grp);
    }
    card.appendChild(head);
    card.appendChild(el("div","section-body", escapeHtml(unit[sec])));

    if(mode==="unit"){
      const revKey = unitKey()+"|"+sec;
      const revs = EDITS[revKey] || [];
      if(revs.length){
        const revBox = el("div","students");
        revBox.appendChild(el("div","students-label",`저장한 수정본 (${revs.length})`));
        appendRevList(revBox, revs, revKey, sec, null);
        card.appendChild(revBox);
      }
    }
    if(mode==="student"){
      const stBox = el("div","students");
      stBox.appendChild(el("div","students-label","학생별 수정본 — 이름을 누르면 펼쳐집니다"));
      STUDENTS.forEach(st=>{
        const revKey = unitKey()+"|"+sec+"|"+st.id;
        const revs = EDITS[revKey] || [];
        const toggleId = sec+"|"+st.id;
        const block = el("div","student-block"+(openStudents.has(toggleId)?" open":""));
        const sh = el("div","student-head");
        const arrow = openStudents.has(toggleId) ? "▾" : "▸";
        sh.innerHTML = `<span class="student-name">${arrow} ${escapeHtml(st.name)} 학생을 위한 수정본</span>
                        <span class="student-count">${revs.length ? revs.length+"개 저장됨" : "없음"}</span>`;
        sh.onclick = ()=>{
          if(openStudents.has(toggleId)) openStudents.delete(toggleId);
          else openStudents.add(toggleId);
          renderDetail();
        };
        block.appendChild(sh);
        const body = el("div","student-body");
        if(revs.length===0){
          body.appendChild(el("div","rev-empty","아직 저장된 수정본이 없습니다."));
        }else{
          appendRevList(body, revs, revKey, sec, st);
        }
        const newBtn = el("button","btn primary","수정 후 저장 (새 수정본 만들기)");
        newBtn.onclick = (e)=>{
          e.stopPropagation();
          openModal(sec, st, latestOrOriginal(sec, st, unit[sec]));
        };
        body.appendChild(newBtn);
        block.appendChild(body);
        stBox.appendChild(block);
      });
      card.appendChild(stBox);
    }
    box.appendChild(card);
  });
}

function appendRevList(container, revs, revKey, sec, student){
  revs.slice().reverse().forEach((rv, idxFromEnd)=>{
    const realIdx = revs.length - 1 - idxFromEnd;
    const item = el("div","rev-item");
    const meta = el("div","rev-meta");
    meta.appendChild(el("span","rev-date", rv.at));
    const g = el("div","btn-group");
    const cb = el("button","btn","복사");
    cb.onclick = ()=>copyText(rv.text, cb);
    const eb = el("button","btn","이 내용 다시 수정");
    eb.onclick = ()=>openModal(sec, student, rv.text);
    const db = el("button","btn danger","삭제");
    db.onclick = async ()=>{
      revs.splice(realIdx,1);
      if(revs.length===0) delete EDITS[revKey];
      await storeSet(KEY_EDITS, EDITS); renderDetail();
    };
    g.appendChild(cb); g.appendChild(eb); g.appendChild(db);
    meta.appendChild(g);
    item.appendChild(meta);
    item.appendChild(el("div","rev-text", escapeHtml(rv.text)));
    container.appendChild(item);
  });
}
function latestOrOriginal(sec, student, original){
  const revKey = unitKey()+"|"+sec+(student ? "|"+student.id : "");
  const revs = EDITS[revKey];
  return (revs && revs.length) ? revs[revs.length-1].text : original;
}
function renderAll(){
  renderTabs(); renderSubjects(); renderGrades(); renderSemesters(); renderUnits(); renderDetail();
}

async function copyText(text, btn){
  let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try{ ok = document.execCommand("copy"); }catch(_){}
    ta.remove();
  }
  if(ok && btn){
    const orig = btn.textContent;
    btn.textContent = "복사됨 ✓"; btn.classList.add("copied");
    setTimeout(()=>{ btn.textContent = orig; btn.classList.remove("copied"); }, 1500);
  }
  toast(ok ? "복사했습니다. 한글(HWP) 등에 붙여넣기 하세요." : "복사에 실패했습니다.");
}

let modalSection = null, modalStudent = null;
function openModal(sec, student, text){
  modalSection = sec; modalStudent = student;
  document.getElementById("modalTitle").textContent =
    student ? `${sec} — ${student.name} 학생을 위한 수정본` : `${sec} — 수정 후 저장`;
  document.getElementById("modalText").value = text;
  document.getElementById("modalBack").classList.add("open");
}
function closeModal(){ document.getElementById("modalBack").classList.remove("open"); }
document.getElementById("modalBack").addEventListener("click", e=>{
  if(e.target.id==="modalBack") closeModal();
});

async function saveEdit(){
  const text = document.getElementById("modalText").value.trim();
  if(!text){ toast("내용이 비어 있습니다."); return; }
  const revKey = unitKey()+"|"+modalSection+(modalStudent ? "|"+modalStudent.id : "");
  if(!EDITS[revKey]) EDITS[revKey] = [];
  const now = new Date();
  const at = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,"0")}.${String(now.getDate()).padStart(2,"0")} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  EDITS[revKey].push({text, at});
  await storeSet(KEY_EDITS, EDITS);
  if(modalStudent) openStudents.add(modalSection+"|"+modalStudent.id);
  closeModal(); renderDetail();
  toast("저장했습니다.");
}

let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}

function openNameModal(){
  const list = document.getElementById("nameList");
  list.innerHTML = "";
  STUDENTS.forEach(st=>addNameRow(st.id, st.name));
  document.getElementById("nameBack").classList.add("open");
}
function closeNameModal(){ document.getElementById("nameBack").classList.remove("open"); }
document.getElementById("nameBack").addEventListener("click", e=>{
  if(e.target.id==="nameBack") closeNameModal();
});
function addNameRow(id, name){
  const list = document.getElementById("nameList");
  const row = el("div","name-row");
  row.dataset.sid = id;
  const input = document.createElement("input");
  input.type = "text"; input.value = name; input.placeholder = "학생 이름";
  input.maxLength = 20;
  const del = el("button","btn danger","삭제");
  del.onclick = ()=>{
    const hasEdits = Object.keys(EDITS).some(k=>k.endsWith("|"+id));
    if(hasEdits && !confirm("이 학생에게 저장된 수정본이 있습니다.\n명단에서 지우면 화면에서 보이지 않게 됩니다. (백업 파일에는 남습니다)\n정말 삭제할까요?")) return;
    row.remove();
  };
  row.appendChild(input); row.appendChild(del);
  list.appendChild(row);
}
let newIdCounter = 100;
function addStudentRow(){
  addNameRow("s"+(Date.now()%100000)+"_"+(newIdCounter++), "");
}
async function saveNames(){
  const rows = document.querySelectorAll("#nameList .name-row");
  const next = [];
  for(const r of rows){
    const name = r.querySelector("input").value.trim();
    if(!name) continue;
    next.push({id:r.dataset.sid, name});
  }
  if(next.length===0){ toast("학생이 한 명도 없습니다. 이름을 입력해 주세요."); return; }
  STUDENTS = next;
  await storeSet(KEY_STUDENTS, STUDENTS);
  closeNameModal(); renderDetail();
  toast("학생 명단을 저장했습니다.");
}

function exportEdits(){
  const payload = { students: STUDENTS, edits: EDITS };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "교육과정_수정내용_백업.json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("수정 내용과 학생 명단을 파일로 내보냈습니다.");
}
async function importEdits(ev){
  const file = ev.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    const incomingEdits = data.edits || data;
    Object.keys(incomingEdits).forEach(k=>{
      if(!EDITS[k]) EDITS[k] = [];
      EDITS[k] = EDITS[k].concat(incomingEdits[k]);
    });
    await storeSet(KEY_EDITS, EDITS);
    if(Array.isArray(data.students) && data.students.length){
      STUDENTS = data.students;
      await storeSet(KEY_STUDENTS, STUDENTS);
    }
    renderAll();
    toast("가져오기 완료.");
  }catch(e){ toast("파일을 읽지 못했습니다. JSON 백업 파일인지 확인하세요."); }
  ev.target.value = "";
}

(async ()=>{
  EDITS = (await storeGet(KEY_EDITS)) || {};
  STUDENTS = (await storeGet(KEY_STUDENTS)) || DEFAULT_STUDENTS.map(s=>({...s}));
  sel = {
    tab:"특수교육 교육과정", subject:"수학", grade:"3~4학년군",
    semester:null, unit:"3학년 1단원. 규칙 찾기"
  };
  renderAll();
})();
