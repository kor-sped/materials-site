<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>알파벳 따라 쓰기</title>
<style>
:root{--bg:#FFF7E8;--ink:#1E2A4A;--card:#fff;--line:#E6DCC8;--muted:#5b6676;--ok:#16853F;--org:#E06100;--blue:#2F6BFF}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#stage{position:fixed;left:50%;top:50%;transform-origin:center center;display:grid;grid-template-rows:72px 1fr 136px;gap:10px;padding:12px 16px}
/* 위 띠 */
#top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
#left{display:flex;align-items:center;gap:16px}
#stepName{font-size:30px;font-weight:700}
#exit{height:68px;border-radius:16px;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;gap:6px;padding:0 14px 0 10px;font-size:24px;font-weight:700;flex:none}
#exit svg{width:40px;height:40px}
#letter.word{font-size:40px;font-family:inherit;color:var(--org)}
#letter{font-size:56px;font-weight:700;min-width:90px;text-align:center;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif}
#tools{justify-self:end;display:flex;gap:10px}
.icon{height:68px;min-width:68px;border-radius:16px;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;position:relative;font-size:22px;font-weight:700}
.icon svg{width:40px;height:40px}
#gear{padding:0}
#gear.pressing::after{content:"";position:absolute;inset:-6px;border-radius:20px;border:4px solid var(--org);animation:press 2s linear forwards}
@keyframes press{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
/* 가운데 */
#main{display:grid;grid-template-columns:auto 1fr;gap:18px;min-height:0}
#padWrap{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:6px;height:100%;min-height:0}
#pad{height:100%;width:auto;aspect-ratio:380/440;display:block;touch-action:none;-webkit-touch-callout:none}
#pad.wide{aspect-ratio:760/440}
#order{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px 16px;min-height:0;overflow:hidden}
#order h3{margin:0 0 6px;font-size:22px}
.orow{margin-bottom:10px}
.orow .lbl{font-size:18px;color:var(--muted);margin-bottom:4px}
.thumbs{display:flex;gap:10px}
.thumb{width:116px;height:134px;border-radius:12px;border:3px solid transparent;background:#fffdf8;transition:opacity .25s}
.thumb.now{border-color:var(--blue)}
.thumb.wait{opacity:0}
#order.covered .orow{display:none}
#order.covered::after{content:"기억해서 써요";display:block;font-size:24px;color:var(--muted);text-align:center;margin-top:120px}
/* 아래 */
#bottom{display:grid;grid-template-columns:170px 1fr 170px;align-items:center;gap:10px}
#helpBtn{width:150px;height:84px;border-radius:18px;border:3px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;gap:8px;font-size:26px;font-weight:700}
#helpBtn svg{width:40px;height:40px}
#helpBtn:disabled{opacity:.3;cursor:default}
#say{text-align:center}
#instr{font-size:32px;font-weight:700;min-height:46px}
#action{min-height:88px;display:flex;align-items:center;justify-content:center;gap:24px;margin-top:4px}
.go{min-width:220px;height:80px;border-radius:40px;border:0;background:var(--ok);color:#fff;font-size:30px;font-weight:700;padding:0 34px}
.go.sub{background:#fff;color:var(--ink);border:3px solid var(--line)}
/* 처음 · 끝 */
#cover{position:absolute;inset:88px 0 0 0;z-index:8;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}
#cover h1{font-size:64px;margin:0;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif}
#cover p{font-size:34px;margin:0;font-weight:700}
#cover .go{min-width:300px;height:100px;font-size:40px;border-radius:50px}
/* 그림 */
.ln{stroke-width:3}
.done{fill:none;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.gray{fill:none;stroke:#E4DED3;stroke-width:26;stroke-linecap:round;stroke-linejoin:round}
.guide{fill:none;stroke-width:5;stroke-dasharray:3 12;stroke-linecap:round}
.kid{fill:none;stroke:var(--ink);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.kid.fade{transition:opacity .4s;opacity:0}
.pulse{animation:pul .8s ease-in-out 3}
@keyframes pul{50%{transform:scale(1.6)}}
.pulse{transform-box:fill-box;transform-origin:center}
/* 나가기 확인 창 */
#exitask{position:absolute;inset:0;background:rgba(30,42,74,.45);z-index:11;display:flex;align-items:center;justify-content:center}
#exitbox{background:#fff;border-radius:24px;padding:40px 48px;display:flex;flex-direction:column;align-items:center;gap:30px;max-width:90%}
#exitbox p{font-size:48px;font-weight:700;margin:0;text-align:center}
#exitbtns{display:flex;gap:28px;align-items:center;flex-wrap:wrap;justify-content:center}
#exitStop{min-width:180px;height:72px;border-radius:36px;border:3px solid var(--line);background:var(--card);font-size:28px;font-weight:700;padding:0 28px}
/* 어른 화면 */
#adult{position:absolute;inset:0;background:rgba(30,42,74,.45);z-index:10;display:flex;align-items:center;justify-content:center}
#panel{background:#fff;border-radius:20px;width:min(94%,960px);max-height:94%;overflow:auto;padding:22px 30px;font-size:20px;line-height:1.55;-webkit-user-select:text;user-select:text}
#panel h2{font-size:26px;margin:0 0 8px}
#panel h3{font-size:21px;margin:18px 0 6px}
#panel label{display:inline-flex;align-items:center;gap:8px;margin:4px 18px 4px 0;font-size:21px}
#panel input[type=radio]{width:26px;height:26px}
.lgrid{display:grid;grid-template-columns:repeat(13,1fr);gap:6px;max-width:820px}
.lgrid button{height:50px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:700}
.lgrid button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.small{height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:18px;padding:0 14px;margin:6px 8px 0 0}
#panel table{border-collapse:collapse;font-size:19px}
#panel th,#panel td{border:1px solid var(--line);padding:5px 12px;text-align:center}
#panel th{background:#f6f2ea}
.note{color:var(--muted);font-size:17px}
[hidden]{display:none!important}
/* 세로 화면 */
.port #main{grid-template-columns:1fr;grid-template-rows:660px 1fr;justify-items:center}
.port #padWrap{height:660px}
.port #order{width:100%}
/* 스크립트가 안 도는 미리보기 화면에서만 보이는 안내 */
#nojs{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#nojs div{max-width:640px;font-size:22px;line-height:1.6}
#nojs b{display:block;font-size:28px;margin-bottom:10px}
</style>

const $ = id => document.getElementById(id);

/* ---------- 상태 ---------- */
const S = {

/* ---------- 화면 맞추기 ---------- */

/* ---------- 쓰는 순서 칸 ---------- */
function buildThumbs(){

    const box = $(row).querySelector('.thumbs'); box.innerHTML = '';
    $(row).hidden = !(SET.case === 'both' || SET.case === kase);
    const st = prep(DATA[S.list[S.li]][kase]);
    st.forEach((s, k) => {
      const svg = el('svg', { viewBox: '0 -48 380 440', class: 'thumb' }, box);
      fourLines(svg, 380);
      const g = el('g', {}, svg);
      st.slice(0, k).forEach(o => drawStroke(g, o, NAVY));

  }
}
function markThumbs(kase, upto, now){

}
function allThumbs(state){ ['rowU', 'rowL'].forEach(r => [...$(r).querySelector('.thumbs').children].forEach(t => { t.classList.toggle('wait', state === 'wait'); t.classList.remove('now'); })); }

/* ---------- 차례 ---------- */
function makePhases(){

  const ph = [];

  ph.push({ stp: 'end' });

}
const STEPNAME = { see: '보기', trace: '따라 쓰기', recall: '기억해 쓰기', end: '' };
function cur(){ return S.phases[S.pi]; }
function letterChar(kase){ const L = S.list[S.li]; return kase === 'lower' ? L.toLowerCase() : L; }
function firstOf(stp){ return S.phases.findIndex(p => p.stp === stp) === S.pi; }

function startLetters(){

  S.li = 0; S.rec = {};
  startLetter();
}

}
function startPhase(){
  clearTimers(); endLine(true); S.busy = false;

  S.strokes = S.base; S.cur = 0; S.help = 0; S.wrongs = 0; S.dx = 0;

/* 보기: 한 획씩 시범 */
function runSee(){

  pad.innerHTML = ''; fourLines(pad, 380);

  markThumbs(P.kase, 0, null);

  const other = P.kase === 'upper' ? 'lower' : 'upper';

  $('instr').textContent = '잘 봐요.';

  const next = () => {

/* 쓰기 화면 그리기 */

/* ---------- 손 · 펜 받기 ---------- */

/* ---------- 도움 ---------- */

$('helpBtn').addEventListener('click', () => { if (writing()) doHelp(S.help + 1); });

/* ---------- 어른 화면 ---------- */

['pointerup','pointerleave','pointercancel'].forEach(t => gear.addEventListener(t, () => { clearTimeout(pressT); gear.classList.remove('pressing'); }));

let draft = null;
function openAdult(){

  const LV = ['도움 없이', '도움 씀', '넘어감'];
  const done = S.list.slice(0, S.li + 1).filter(L => Object.keys(S.rec).some(k => k.startsWith(L + '|')) || S.list.indexOf(L) < S.li);
  const rows = done.map(L => `<tr><td>${L} ${L.toLowerCase()}</td><td>${SET.case === 'lower' ? '–' : LV[S.rec[L + '|upper'] || 0]}</td><td>${SET.case === 'upper' ? '–' : LV[S.rec[L + '|lower'] || 0]}</td></tr>`).join('');
  const r = (name, val, txt) => `<label><input type="radio" name="${name}" value="${val}"${String(SET[name]) === String(val) ? ' checked' : ''}>${txt}</label>`;
  $('panel').innerHTML = `
    <h2>어른 화면</h2>
    <h3>모드</h3>
    ${r('mode','alone','아이 혼자')}${r('mode','together','어른과 함께')}
    <div class="note">아이 혼자: 같은 획을 2번 틀리면 그 획을 한 번 그려 보입니다. 넘어가기(화면이 그 획을 그려 주고 다음 획으로)는 아이가 [도움]을 눌러야만 됩니다. 어른과 함께: 저절로 아무것도 하지 않습니다.</div>
    <h3>쓸 글자 <span class="note">(알파벳 차례로 씁니다)</span></h3>
    <div class="lgrid" id="lgrid">${LETTERS.map(L => `<button data-l="${L}" class="${SET.letters.includes(L) ? 'on' : ''}">${L}</button>`).join('')}</div>
    <button class="small" id="allOn">모두</button><button class="small" id="allOff">모두 끄기</button>
    <div class="note" id="lnote"></div>
    <h3>대문자 · 소문자</h3>
    ${r('case','both','둘 다')}${r('case','upper','대문자만')}${r('case','lower','소문자만')}
    <h3>기억해 쓰기 <span class="note">(본보기를 모두 가리고 쓰기)</span></h3>
    ${r('recall','true','켜기')}${r('recall','false','끄기')}
    <h3>이번 기록 <span class="note">(이 화면에만 있고, 창을 닫으면 사라집니다)</span></h3>
    <div>마지막으로 쓴 글자: ${S.last || '–'}</div>
    ${rows ? `<table><tr><th>글자</th><th>대문자</th><th>소문자</th></tr>${rows}</table>` : '<div class="note">아직 쓴 글자가 없습니다.</div>'}
    <h3>안내</h3>
    <div>· 영상을 먼저 함께 본 뒤 이 화면으로 넘어가세요.<br>· 펜(스타일러스)이 있으면 펜으로 쓰게 해 주세요. 손가락보다 자세와 쥐기에 낫다고 작업치료사들이 권합니다.<br>· 어디까지 했는지 저장하지 않습니다. 다음 날은 쓸 글자를 다시 고르세요.<br>· 보호자께: 틀려도 화면은 "틀렸다"고 하지 않고 그 선만 지웁니다. 답을 대신 써 주기보다 [도움]을 함께 눌러 보세요. 아이 이름과 쓴 것은 저장하거나 보내지 않습니다.</div>
    <div style="margin-top:18px"><button class="go" id="closeAdult">닫기</button></div>`;
  $('adult').hidden = false;
  const paint = () => { [...$('lgrid').children].forEach(b => b.classList.toggle('on', draft.letters.includes(b.dataset.l))); $('lnote').textContent = draft.letters.length ? '' : '글자를 하나 이상 고르세요.'; };
  $('lgrid').onclick = e => { const l = e.target.dataset && e.target.dataset.l; if (!l) return; draft.letters = draft.letters.includes(l) ? draft.letters.filter(x => x !== l) : draft.letters.concat(l); paint(); };
  $('allOn').onclick = () => { draft.letters = LETTERS.slice(); paint(); };
  $('allOff').onclick = () => { draft.letters = []; paint(); };
  $('closeAdult').onclick = closeAdult;
}
function closeAdult(){
  if (!draft.letters.length) { $('lnote').textContent = '글자를 하나 이상 고르세요.'; return; }
  const v = n => document.querySelector(`input[name=${n}]:checked`).value;
  const next = { mode: v('mode'), letters: draft.letters.slice().sort(), case: v('case'), recall: v('recall') === 'true' };
  const changed = next.letters.join() !== SET.letters.slice().sort().join() || next.case !== SET.case || next.recall !== SET.recall;
  SET = next; saveSet();
  $('adult').hidden = true; S.adult = false;
  if (S.view === 'cover') return;
  if (changed) { $('cover').hidden = true; return startLetters(); }
  if (S.view === 'allend') return;
  resume();
}

/* ---------- 나가기 (설계 5.8, 뺄셈과 같음) ---------- */
const HUB = 'https://kor-sped.github.io/materials-site/%EC%A1%B0%EC%9E%91.html';
let exitOpen = false;
function openExit(){
  if (S.adult) return;
  S.adult = true; exitOpen = true; clearTimers(); stopSound(); endLine(true);
  $('exitmsg').textContent = '그만할까요?';
  $('exitStop').hidden = false;
  $('exitask').hidden = false;
}
function closeExit(){
  $('exitask').hidden = true; S.adult = false; exitOpen = false;
  if (S.view === 'cover' || S.view === 'allend') return;
  if (S.view === 'intro') { $('cover').hidden = true; return startLetters(); }
  resume();
}
function leave(){
  if (history.length > 1) { history.back(); return; }
  if (location.protocol === 'http:' || location.protocol === 'https:') { location.href = HUB; return; }
  $('exitmsg').textContent = '창을 닫아 주세요.';
  $('exitStop').hidden = true;
}
$('exit').onclick = openExit;
$('exitGo').onclick = closeExit;
$('exitStop').onclick = leave;
addEventListener('pageshow', e => { if (e.persisted && exitOpen) closeExit(); });

/* ---------- 시작 ---------- */
$('startBtn').addEventListener('click', () => {
  $('startBtn').disabled = true;
  S.view = 'intro';
  play('intro', () => { $('cover').hidden = true; startLetters(); });
});
fit();
setHelpBtn();
</script>
