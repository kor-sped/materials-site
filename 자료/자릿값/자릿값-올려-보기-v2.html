<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>자릿값 올려 보기 v2 — 천조까지, 네 자리씩 끊어 읽기</title>
<style>
  :root { --scale:1; --gap:0em; --bg:#faf6ef; --ink:#2a2a26; --line:#e6ded0; --muted:#7a7468;
          --c만:#7b5ea7; --c천:#2f6db5; --c백:#2f8f5b; --c십:#e08a2e; --c일:#c8413f;
          --g조:#7b5ea7; --g억:#2f6db5; --g만:#2f8f5b; --g일:#c65a1e; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; }
  body { min-height:100vh; display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); background:#fff; }
  header h1 { font-size:1.05em; margin:0 6px 0 0; font-weight:700; }
  header .grp { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  header label { font-size:.9em; color:var(--muted); }
  button, input, select { font:inherit; }
  button { white-space:nowrap; border:1.5px solid #c8703f; background:#fff; color:#c8703f; border-radius:9px; padding:7px 12px; cursor:pointer; font-size:.95em; }
  button.primary { background:#c8703f; color:#fff; }
  button.on { background:#8fa376; border-color:#8fa376; color:#fff; }
  button.step { border-color:#2f6db5; color:#2f6db5; font-weight:700; }
  button.step.on { background:#2f6db5; color:#fff; border-color:#2f6db5; }
  input[type=text] { width:12.5em; padding:7px 10px; border:1.5px solid var(--line); border-radius:9px; font-size:1.02em; letter-spacing:.06em; text-align:center; }
  .seg { display:inline-flex; } .seg button { border-radius:0; padding:6px 11px; margin-left:-1.5px; } .seg button:first-child { border-radius:9px 0 0 9px; } .seg button:last-child { border-radius:0 9px 9px 0; } .seg button.on { background:#c8703f; color:#fff; border-color:#c8703f; }
  .grp .val { font-size:.85em; color:var(--muted); min-width:2.2em; text-align:center; }
  select { padding:6px 8px; border-radius:9px; border:1.5px solid var(--line); background:#fff; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px 8px 76px; gap:8px; overflow:hidden; }
  .stepmsg { min-height:1.6em; font-size:clamp(17px,2.6vw,26px); font-weight:700; color:#2f6db5; text-align:center; }
  .number { display:flex; gap:0; align-items:flex-start; justify-content:center; font-size:200px; white-space:nowrap; }
  .number.two { flex-wrap:wrap; justify-content:flex-end; row-gap:.28em; max-width:calc(5.7em + 16 * var(--gap)); }   /* 좁은 화면: 두 묶음씩 두 줄 */
  .g4 { display:flex; flex-direction:column; align-items:stretch; transition:margin .35s ease; border-radius:.06em; }
  .g4 .ds { display:flex; justify-content:center; }
  .g4.sep { margin-left:.34em; }
  .g4:first-child.sep { margin-left:0; }
  .g4 .gl { font-size:.27em; line-height:1.15; font-weight:800; text-align:center; margin-top:.35em; padding:.18em .2em .22em; border-top:.12em solid var(--gc); color:var(--gc); opacity:0; transform:translateY(-6px); transition:opacity .3s, transform .3s, background .2s; cursor:pointer; border-radius:0 0 .4em .4em; white-space:nowrap; }
  .g4.lab .gl { opacity:1; transform:none; }
  .g4 .gl b { font-size:1.25em; margin-left:.06em; }
  .g4 .gl .gv.zero { color:#b9b4aa; font-weight:500; }
  .g4.hl .gl { background:var(--gc); color:#fff; }
  .g4.hl .gl .gv.zero { color:#fff; }
  .g4.hl { background:rgba(0,0,0,.035); }
  .digit { position:relative; padding:0 .015em .14em; font-size:inherit; margin:0 var(--gap); font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; text-align:center; min-width:.6em; -webkit-text-stroke:.018em var(--bg); paint-order:stroke fill; font-weight:800; line-height:1; letter-spacing:0;
           cursor:pointer; user-select:none; -webkit-user-select:none; transition:color .12s, transform .12s; touch-action:manipulation; color:var(--ink); }
  .digit .pv { position:absolute; left:50%; transform:translateX(-50%); bottom:.01em; font-size:.17em; font-weight:700; line-height:1.2; white-space:nowrap; opacity:0; transition:opacity .15s; color:var(--c); -webkit-text-stroke:0; background:var(--bg); padding:0 .25em; border-radius:.3em; z-index:2; }
  .digit.active { transform:translateY(-4px); color:var(--c); }
  .digit.active .pv { opacity:1; }
  body.chunk .digit { color:var(--c); }
  .digit.zero, body.chunk .digit.zero { color:#b9b4aa; } .digit.zero .pv { color:#b9b4aa; }
  .value { min-height:clamp(36px,6vw,64px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; text-align:center; }
  .value .read { font-size:clamp(22px,4.4vw,44px); font-weight:700; }
  .value.none .read, .value.idle .read { color:#b9b4aa; font-weight:500; }
  .sum { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px 10px; font-size:clamp(17px,3.2vw,32px); font-weight:700; min-height:1.6em; }
  .sum span.p { padding:2px 10px; border-radius:10px; background:#fff; border:2px solid var(--pc,var(--line)); color:var(--pc,inherit); }
  .sum .total { padding:2px 12px; border-radius:10px; background:#232320; color:#efe6d6; }
  .sum .full { width:100%; text-align:center; font-size:.8em; color:var(--muted); font-weight:600; }
  footer { position:fixed; left:0; right:0; bottom:0; padding:8px 16px 10px 120px; font-size:.8em; color:var(--muted); background:linear-gradient(transparent, var(--bg) 40%); text-align:right; }
  @media (max-width:560px) { header h1 { width:100%; } footer { padding-left:16px; text-align:left; padding-bottom:56px; } input[type=text]{ width:10em; } }
  body:not(.detail) .value, body:not(.detail) .sum { display:none !important; }
  body:not(.chunk) .g4 .gl { display:none; }
</style>
</head>
<body>
<header>
  <h1>자릿값 올려 보기</h1>
  <div class="grp"><label for="digits">자릿수</label>
    <select id="digits"></select></div>
  <div class="grp"><button class="primary" id="newBtn">새 숫자</button></div>
  <div class="grp"><input type="text" id="typed" inputmode="numeric" pattern="[0-9]*" maxlength="16" placeholder="직접 입력 (16자리까지)"><button id="setBtn">보기</button></div>
  <div class="grp"><button id="chunkBtn" class="step" title="뒤에서부터 네 자리씩 끊고 만·억·조 이름표를 붙여요">네 자리 끊기</button><button id="stepsBtn" class="step" title="끊기 → 이름표 → 앞에서부터 읽기를 차례로 보여 줘요">▶ 차례로 읽기</button><button id="readAllBtn" title="전체를 읽어 줘요">🔊 전체 읽기</button></div>
  <div class="grp"><label>크기</label><span class="seg" id="sizeSeg"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button></span><input type="hidden" id="sizeR" value="3"></div>
  <div class="grp"><label>간격</label><button id="gapMinus" title="숫자를 붙여요">◀ 좁게</button><span class="val" id="gapV">0</span><button id="gapPlus" title="숫자를 벌려요">넓게 ▶</button><input type="hidden" id="gapR" value="0"><button id="lookReset" title="크기 3, 간격 0으로">↺</button></div>
  <div class="grp"><button id="zeroBtn" title="0이 든 숫자를 자주 내요">0 섞기</button><button id="soundBtn" class="on">🔊 소리</button><button id="detailBtn" title="한글 읽기와 더하기 식을 아래에 보여 줘요">읽기·식 보기</button><button id="resetBtn">처음부터</button></div>
</header>

<main>
  <div class="stepmsg" id="stepmsg"></div>
  <div class="number" id="number"></div>
  <div class="value idle" id="value"><div class="read" id="vread">숫자를 짚어 보세요</div></div>
  <div class="sum" id="sum"></div>
</main>
<footer>숫자를 짚으면 그 자리 값 · "네 자리 끊기"를 켜면 만·억·조 이름표, 이름표를 누르면 그 묶음을 읽어 줘요 · 키보드: + − 크기, [ ] 간격, ← → 자리 옮기기, 스페이스 새 숫자</footer>

<script>
(function(){
  var DIGIT_KO = ["","일","이","삼","사","오","육","칠","팔","구"];
  var INPLACE = ["일","십","백","천"];           // 묶음 안 자리
  var UNIT = ["","만","억","조"];                 // 묶음 이름 (오른쪽부터)
  var GCOLOR = ["var(--g일)","var(--g만)","var(--g억)","var(--g조)"];
  var PCOLOR = {"만":"var(--c만)","천":"var(--c천)","백":"var(--c백)","십":"var(--c십)","일":"var(--c일)"};
  var $ = function(id){ return document.getElementById(id); };
  var numberEl=$("number"), valueEl=$("value"), vread=$("vread"), sumEl=$("sum"), stepmsg=$("stepmsg");
  var state = { digits:[], visited:[], sound:true, zeroMode:false, active:-1, chunk:false, timers:[] };

  /* ── 읽기 규칙 */
  function readUnder10000(ds){ // ds: 길이 1~4 숫자 배열(천→일)
    var s="", n=ds.length;
    for (var i=0;i<n;i++){ var d=ds[i], k=n-1-i; if(!d) continue; s += (k===0 ? DIGIT_KO[d] : (d===1?"":DIGIT_KO[d]) + INPLACE[k]); }
    return s;
  }
  function groups(){ // 왼쪽→오른쪽 [{g, ds, start}]
    var ds=state.digits, n=ds.length, out=[], first=n%4||4, i=0, g=Math.ceil(n/4)-1;
    while(i<n){ var len=(i===0?first:4); out.push({g:g, ds:ds.slice(i,i+len), start:i}); i+=len; g--; }
    return out;
  }
  function groupValue(gr){ return parseInt(gr.ds.join(""),10); }
  function readGroup(gr){ var v=groupValue(gr); if(!v) return ""; var r=readUnder10000(gr.ds); if(gr.g===1 && v===1) r=""; return r + UNIT[gr.g]; }
  function readAll(){ var s=groups().map(readGroup).filter(Boolean).join(" "); return s || "영"; }
  function mixedAll(){ return groups().map(function(gr){ var v=groupValue(gr); return v? v+UNIT[gr.g] : ""; }).filter(Boolean).join(" ") || "0"; }
  function posOf(i){ return state.digits.length-1-i; }          // 오른쪽부터 0
  function placeName(i){ var p=posOf(i), k=p%4, g=Math.floor(p/4); return (k===0 ? (g===0?"일":UNIT[g]) : INPLACE[k]+UNIT[g]); } // 예: 백조, 천만, 만, 십
  function readPlace(i){ var d=state.digits[i], p=posOf(i), k=p%4, g=Math.floor(p/4); if(!d) return "";
    var head=(k===0 ? ((g===1&&d===1)?"":DIGIT_KO[d]) : (d===1?"":DIGIT_KO[d])+INPLACE[k]); return head+UNIT[g]; }
  function pvText(i){ var d=state.digits[i], p=posOf(i), k=p%4, g=Math.floor(p/4);
    if(p<=4) return String(d*Math.pow(10,p));                    // 5자리까지는 v1처럼 숫자 그대로 (70000)
    return String(d*Math.pow(10,k)) + UNIT[g]; }                 // 큰 수는 400조, 8000억처럼
  function colorOf(i){ var p=posOf(i), g=Math.floor(p/4);
    if(state.chunk || state.digits.length>5) return GCOLOR[g];
    return PCOLOR[placeName(i)] || GCOLOR[g]; }

  /* ── 숫자 만들기 */
  function makeNumber(n){
    var digits=[];
    for (var i=0;i<n;i++){ var d=Math.floor(Math.random()*10);
      if(i===0&&d===0) d=1+Math.floor(Math.random()*9);
      if(state.zeroMode&&i>0&&Math.random()<0.5) d=0;
      digits.push(d); }
    if(!state.zeroMode && digits.slice(1).every(function(x){return x===0;})) digits[n-1]=1+Math.floor(Math.random()*9);
    return digits;
  }
  function clearTimers(){ state.timers.forEach(clearTimeout); state.timers=[]; $("stepsBtn").classList.remove("on"); $("stepsBtn").textContent="▶ 차례로 읽기"; }
  function setNumber(digits){
    clearTimers(); stepmsg.textContent="";
    state.digits=digits; state.visited=digits.map(function(){return false;}); state.active=-1;
    if($("digits").value!==String(digits.length)) $("digits").value=String(Math.max(2,digits.length));
    numberEl.innerHTML="";
    groups().forEach(function(gr){
      var ge=document.createElement("div"); ge.className="g4"; ge.dataset.g=gr.g; ge.style.setProperty("--gc", GCOLOR[gr.g]);
      var dsEl=document.createElement("div"); dsEl.className="ds";
      gr.ds.forEach(function(d,k){ var i=gr.start+k;
        var el=document.createElement("div"); el.className="digit"+(d===0?" zero":""); el.dataset.i=i;
        el.innerHTML=d+'<span class="pv"></span>';
        el.addEventListener("mouseenter", function(){ if(!isTouch) show(i); });
        el.addEventListener("touchstart", function(){ isTouch=true; show(i,true); }, {passive:true});
        el.addEventListener("click", function(e){ e.preventDefault(); show(i,true); });
        dsEl.appendChild(el); });
      var v=groupValue(gr), gl=document.createElement("div"); gl.className="gl";
      gl.innerHTML='<span class="gv'+(v?'':' zero')+'">'+(v? v : "0")+'</span>'+(UNIT[gr.g]?'<b>'+UNIT[gr.g]+'</b>':'');
      gl.title="누르면 이 묶음을 읽어 줘요";
      gl.addEventListener("click", function(){ hlGroup(gr.g, true); });
      ge.appendChild(dsEl); ge.appendChild(gl); numberEl.appendChild(ge);
    });
    recolor(); applyChunk(false);
    valueEl.className="value idle"; vread.textContent="숫자를 짚어 보세요"; renderSum();
    fitWidth();
  }
  function digitEls(){ return numberEl.querySelectorAll(".digit"); }
  function recolor(){ Array.prototype.forEach.call(digitEls(), function(el){ el.style.setProperty("--c", colorOf(+el.dataset.i)); }); }
  var isTouch=false;
  window.addEventListener("touchstart", function(){ isTouch=true; }, {passive:true, once:true});

  /* ── 자리 짚기 */
  var lastSpoken={i:-1,t:0};
  function show(i, speakAgain){
    if(i<0||i>=state.digits.length) return;
    var d=state.digits[i], dup=(lastSpoken.i===i && Date.now()-lastSpoken.t<600); lastSpoken={i:i,t:Date.now()};
    state.active=i;
    Array.prototype.forEach.call(digitEls(), function(el){ el.classList.toggle("active", +el.dataset.i===i); });
    Array.prototype.forEach.call(numberEl.children, function(g){ g.classList.remove("hl"); });
    var el=numberEl.querySelector('.digit[data-i="'+i+'"]'); el.querySelector(".pv").textContent = d===0 ? "없음" : pvText(i);
    if(d===0){ valueEl.className="value none"; vread.textContent=placeName(i)+"의 자리 — 없음"; if(!dup) speak(placeName(i)+"의 자리는 없어요"); }
    else { valueEl.className="value"; vread.textContent=readPlace(i)+"  ("+placeName(i)+"의 자리)"; if(!dup) speak(readPlace(i)); }
    state.visited[i]=true; renderSum();
  }
  function hlGroup(g, sayIt){
    Array.prototype.forEach.call(digitEls(), function(el){ el.classList.remove("active"); });
    var gr=groups().filter(function(x){return x.g===g;})[0]; if(!gr) return;
    Array.prototype.forEach.call(numberEl.children, function(ge){ ge.classList.toggle("hl", +ge.dataset.g===g); });
    var v=groupValue(gr), r=readGroup(gr);
    valueEl.className = v? "value":"value none";
    vread.textContent = v ? (v+UNIT[g]+" — "+r) : ((UNIT[g]||"일")+" 묶음은 없어요 (0000)");
    if(sayIt) speak(v? r : ((UNIT[g]||"일")+" 묶음은 없어요"));
  }
  function renderSum(){
    var n=state.digits.length, html="";
    if(n>5 || state.chunk){
      var parts=groups().filter(function(gr){return groupValue(gr);}).map(function(gr){ return '<span class="p" style="--pc:'+GCOLOR[gr.g]+'">'+groupValue(gr)+UNIT[gr.g]+'</span>'; });
      html = parts.join('<span>+</span>') + '<span class="full">'+readAll()+'</span>';
    } else if(state.visited.every(Boolean)){
      var ps=[], total=0;
      state.digits.forEach(function(d,i){ if(d>0){ var val=d*Math.pow(10,posOf(i)); total+=val; ps.push('<span class="p" style="--pc:'+colorOf(i)+'">'+val+'</span>'); } });
      html = ps.join('<span>+</span>')+'<span>=</span><span class="total">'+total+'</span><span class="full">'+readAll()+'</span>';
    }
    sumEl.innerHTML=html;
  }

  /* ── 네 자리 끊기 */
  function applyChunk(animated){
    document.body.classList.toggle("chunk", state.chunk);
    $("chunkBtn").classList.toggle("on", state.chunk);
    Array.prototype.forEach.call(numberEl.children, function(ge){ ge.classList.toggle("sep", state.chunk); ge.classList.toggle("lab", state.chunk); ge.classList.remove("hl"); });
    recolor(); renderSum(); if(!animated) fitWidth();
  }
  function later(ms, fn){ state.timers.push(setTimeout(fn, ms)); }
  function runSteps(){
    clearTimers();
    if(state.digits.length<5){ stepmsg.textContent="네 자리까지는 끊을 곳이 없어요. 다섯 자리부터 해 봐요."; return; }
    $("stepsBtn").classList.add("on"); $("stepsBtn").textContent="■ 멈추기";
    state.chunk=true; document.body.classList.add("chunk"); $("chunkBtn").classList.add("on"); recolor(); renderSum();
    var ges=Array.prototype.slice.call(numberEl.children); ges.forEach(function(g){ g.classList.remove("sep","lab","hl"); });
    Array.prototype.forEach.call(digitEls(), function(el){ el.classList.remove("active"); });
    // 끊긴 상태의 폭으로 미리 맞춘다
    ges.forEach(function(g){ g.classList.add("sep","lab"); }); fitWidth(); ges.forEach(function(g){ g.classList.remove("sep","lab"); });
    var t=300, rev=ges.slice().reverse();
    later(t, function(){ stepmsg.textContent="① 뒤에서부터 네 자리씩 끊어요"; speak("뒤에서부터 네 자리씩 끊어요"); }); t+=2300;
    rev.forEach(function(g,k){ if(k===rev.length-1) return; later(t, function(){ g.classList.add("sep"); }); t+=900; });   // 끊는 곳 = 오른쪽 묶음의 왼쪽 여백
    later(t, function(){ ges.forEach(function(g){ g.classList.add("sep"); }); stepmsg.textContent="② 이름표를 붙여요 — 뒤에서부터 (일), 만, 억, 조"; speak("이름표를 붙여요"); }); t+=1800;
    rev.forEach(function(g){ later(t, function(){ g.classList.add("lab"); var u=UNIT[+g.dataset.g]; if(u) speak(u); }); t+=1000; });
    later(t, function(){ stepmsg.textContent="③ 앞에서부터 읽어요"; speak("앞에서부터 읽어요"); }); t+=2000;
    groups().forEach(function(gr){ var r=readGroup(gr); later(t, function(){ hlGroup(gr.g, true); }); t+= Math.max(1500, r.length*330+700); });
    later(t, function(){ ges.forEach(function(g){ g.classList.remove("hl"); }); stepmsg.textContent=mixedAll(); valueEl.className="value"; vread.textContent=readAll(); speak(readAll()); clearTimersSoft(); });
  }
  function clearTimersSoft(){ state.timers=[]; $("stepsBtn").classList.remove("on"); $("stepsBtn").textContent="▶ 차례로 읽기"; }

  /* ── 소리 */
  if("speechSynthesis" in window){ try{ window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged=function(){ window.speechSynthesis.getVoices(); }; }catch(e){} }
  var warmed=false;
  document.addEventListener("pointerdown", function(){ if(warmed||!("speechSynthesis" in window)) return; warmed=true; try{ var u=new SpeechSynthesisUtterance(" "); u.lang="ko-KR"; u.volume=0; window.speechSynthesis.speak(u);}catch(e){} }, {once:true, passive:true});
  function speak(text){ if(!state.sound||!("speechSynthesis" in window)) return;
    try{ window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(text); u.lang="ko-KR"; u.rate=0.9; window.speechSynthesis.speak(u);}catch(e){} }
  function newNumber(){ var n=parseInt($("digits").value,10); if(n>=6 && !state.chunkTouched) state.chunk=true; if(n<5 && !state.chunkTouched) state.chunk=false; setNumber(makeNumber(n)); }

  /* ── 크기·간격 */
  var LEVEL={1:0.4,2:0.55,3:0.7,4:0.85,5:1.0};
  function fitWidth(){
    numberEl.classList.toggle("two", window.innerWidth<640 && numberEl.children.length>=3);
    numberEl.style.fontSize="100px";
    var r=numberEl.getBoundingClientRect();
    var head=document.querySelector("header").getBoundingClientRect().height;
    var availW=window.innerWidth-24, availH=window.innerHeight-head-(document.body.classList.contains("detail")?190:100);
    var maxFont=100*Math.min(availW/Math.max(1,r.width), availH/Math.max(1,r.height));
    var lv=parseInt($("sizeR").value,10); if(!(lv>=1&&lv<=5)) lv=3;
    var wide=state.digits.length>8 ? Math.max(LEVEL[lv],0.85) : LEVEL[lv];   // 아홉 자리부터는 작아지므로 크기 단계를 덜 줄인다
    numberEl.style.fontSize=Math.max(16, Math.round(maxFont*wide))+"px";
  }
  window.addEventListener("resize", fitWidth);
  function applyLook(){
    var lv=parseInt($("sizeR").value,10), gp=parseInt($("gapR").value,10);
    if(!(lv>=1&&lv<=5)){ lv=3; $("sizeR").value=3; }
    if(!(gp>=-6&&gp<=30)){ gp=Math.min(30,Math.max(-6,isNaN(gp)?0:gp)); $("gapR").value=gp; }
    document.documentElement.style.setProperty("--gap",(gp/100)+"em");
    Array.prototype.forEach.call(document.querySelectorAll("#sizeSeg button"), function(b){ b.classList.toggle("on", parseInt(b.dataset.v,10)===lv); });
    $("gapV").textContent=gp; fitWidth();
    try{ localStorage.setItem("pv-look", JSON.stringify({s:lv,g:gp})); }catch(e){}
  }
  try{ var saved=JSON.parse(localStorage.getItem("pv-look")||"null"); if(saved){ $("sizeR").value=saved.s; $("gapR").value=saved.g; } }catch(e){}

  /* ── 단추 */
  var sel=$("digits"), NAMES={5:"만",8:"천만",9:"억",12:"천억",13:"조",16:"천조"};
  for(var n=2;n<=16;n++){ var o=document.createElement("option"); o.value=n; o.textContent=n+"자리"+(NAMES[n]?" ("+NAMES[n]+")":""); if(n===4) o.selected=true; sel.appendChild(o); }
  Array.prototype.forEach.call(document.querySelectorAll("#sizeSeg button"), function(b){ b.addEventListener("click", function(){ $("sizeR").value=this.dataset.v; applyLook(); }); });
  $("gapMinus").addEventListener("click", function(){ $("gapR").value=Math.max(-6,parseInt($("gapR").value,10)-2); applyLook(); });
  $("gapPlus").addEventListener("click", function(){ $("gapR").value=Math.min(30,parseInt($("gapR").value,10)+2); applyLook(); });
  $("lookReset").addEventListener("click", function(){ $("sizeR").value=3; $("gapR").value=0; applyLook(); });
  applyLook();
  $("newBtn").addEventListener("click", newNumber);
  sel.addEventListener("change", newNumber);
  $("setBtn").addEventListener("click", function(){
    var v=$("typed").value.replace(/\D/g,"").replace(/^0+/,"");
    if(!v||v.length>16){ $("typed").focus(); return; }
    if(v.length>=6 && !state.chunkTouched) state.chunk=true;
    setNumber(v.split("").map(Number)); $("typed").value="";
  });
  $("typed").addEventListener("keydown", function(e){ if(e.key==="Enter") $("setBtn").click(); });
  $("chunkBtn").addEventListener("click", function(){ clearTimers(); stepmsg.textContent=""; state.chunk=!state.chunk; state.chunkTouched=true; applyChunk(false); if(state.chunk) speak("뒤에서부터 네 자리씩"); });
  $("stepsBtn").addEventListener("click", function(){ if(this.classList.contains("on")){ clearTimers(); try{speechSynthesis.cancel();}catch(e){} stepmsg.textContent=""; applyChunk(false); } else runSteps(); });
  $("readAllBtn").addEventListener("click", function(){ valueEl.className="value"; vread.textContent=readAll(); stepmsg.textContent=mixedAll(); speak(readAll()); });
  $("zeroBtn").addEventListener("click", function(){ state.zeroMode=!state.zeroMode; this.classList.toggle("on",state.zeroMode); newNumber(); });
  $("detailBtn").addEventListener("click", function(){ document.body.classList.toggle("detail"); this.classList.toggle("on", document.body.classList.contains("detail")); fitWidth(); });
  $("soundBtn").addEventListener("click", function(){ state.sound=!state.sound; this.classList.toggle("on",state.sound); this.textContent=state.sound?"🔊 소리":"🔇 소리 없음"; if(!state.sound){ try{speechSynthesis.cancel();}catch(e){} } });
  $("resetBtn").addEventListener("click", function(){ setNumber(state.digits.slice()); });
  document.addEventListener("keydown", function(e){
    if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
    if(e.key==="ArrowRight") show(Math.min(state.digits.length-1, state.active+1));
    else if(e.key==="ArrowLeft") show(Math.max(0, state.active<0?0:state.active-1));
    else if(e.key===" "){ e.preventDefault(); newNumber(); }
    else if(e.key==="+"||e.key==="="){ $("sizeR").value=Math.min(5,parseInt($("sizeR").value,10)+1); applyLook(); }
    else if(e.key==="-"){ $("sizeR").value=Math.max(1,parseInt($("sizeR").value,10)-1); applyLook(); }
    else if(e.key==="]"){ $("gapR").value=Math.min(30,parseInt($("gapR").value,10)+2); applyLook(); }
    else if(e.key==="["){ $("gapR").value=Math.max(-6,parseInt($("gapR").value,10)-2); applyLook(); }
  });
  /* 확인용: ?n=429840932245328 */
  var q=new URLSearchParams(location.search).get("n");
  if(q && /^\d{1,16}$/.test(q)){ if(q.length>=6) state.chunk=true; setNumber(q.replace(/^0+/,"").split("").map(Number)); if(new URLSearchParams(location.search).get("detail")) $("detailBtn").click(); }
  else newNumber();
  window.__pv={readAll:readAll, mixedAll:mixedAll, set:function(s){ setNumber(String(s).split("").map(Number)); }, place:function(i){ return [placeName(i), readPlace(i), pvText(i)]; }};
})();
</script>
