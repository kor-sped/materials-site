<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>자릿값 올려 보기 — 5992의 5를 짚으면 아래에 5000</title>
<style>
  :root { --scale:1; --gap:0em; --bg:#faf6ef; --ink:#2a2a26; --line:#e6ded0; --muted:#7a7468;
          --c만:#7b5ea7; --c천:#2f6db5; --c백:#2f8f5b; --c십:#e08a2e; --c일:#c8413f; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; }
  body { min-height:100vh; display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); background:#fff; }
  header h1 { font-size:1.05em; margin:0 8px 0 0; font-weight:700; }
  header .grp { display:flex; align-items:center; gap:6px; }
  header label { font-size:.9em; color:var(--muted); }
  button, input { font:inherit; }
  button { white-space:nowrap; border:1.5px solid #c8703f; background:#fff; color:#c8703f; border-radius:9px; padding:7px 14px; cursor:pointer; font-size:.95em; }
  button.primary { background:#c8703f; color:#fff; }
  button.on { background:#8fa376; border-color:#8fa376; color:#fff; }
  input[type=text] { width:9em; padding:7px 10px; border:1.5px solid var(--line); border-radius:9px; font-size:1.05em; letter-spacing:.08em; text-align:center; }
  .seg { display:inline-flex; } .seg button { border-radius:0; padding:6px 11px; margin-left:-1.5px; } .seg button:first-child { border-radius:9px 0 0 9px; } .seg button:last-child { border-radius:0 9px 9px 0; } .seg button.on { background:#c8703f; color:#fff; }
  .grp .val { font-size:.85em; color:var(--muted); min-width:2.2em; text-align:center; }
  select { font:inherit; padding:6px 8px; border-radius:9px; border:1.5px solid var(--line); background:#fff; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px 8px 70px; gap:6px; overflow:hidden; }
  .hint, .legend { display:none !important; }
  .number { display:flex; gap:0; align-items:flex-start; justify-content:center; transform-origin:center top; transform:scale(var(--fit,1)); }
  .number.n5 .digit { font-size:calc(clamp(80px,min(30vw,56vh),700px) * var(--scale)); }
  .number.n3 .digit { font-size:calc(clamp(96px,min(48vw,56vh),700px) * var(--scale)); }
  .digit { position:relative; padding:0 0 clamp(40px,min(9vw,14vh),170px); font-size:calc(clamp(96px,min(38vw,56vh),700px) * var(--scale)); margin:0 var(--gap); font-weight:800; line-height:1; letter-spacing:0;
           cursor:pointer; user-select:none; -webkit-user-select:none; transition:color .12s, transform .12s; touch-action:manipulation; color:var(--ink); }
  .digit .tag { display:none; }
  .digit .pv { position:absolute; left:50%; transform:translateX(-50%); bottom:0; font-size:clamp(18px,min(6vw,9vh),110px); font-weight:700; line-height:1.2; white-space:nowrap; opacity:0; transition:opacity .15s; }
  .digit.active { transform:translateY(-4px); }
  .digit.active .pv { opacity:1; }
  .digit[data-place="만"].active, .digit[data-place="만"] .pv { color:var(--c만); }
  .digit[data-place="천"].active, .digit[data-place="천"] .pv { color:var(--c천); }
  .digit[data-place="백"].active, .digit[data-place="백"] .pv { color:var(--c백); }
  .digit[data-place="십"].active, .digit[data-place="십"] .pv { color:var(--c십); }
  .digit[data-place="일"].active, .digit[data-place="일"] .pv { color:var(--c일); }
  .digit.zero { color:#b9b4aa; } .digit.zero .pv { color:#b9b4aa; }
  .value { min-height:clamp(40px,7vw,70px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .value .num { display:none; }
  .value .read { font-size:clamp(24px,5vw,48px); font-weight:700; }
  .value.none .read { color:#b9b4aa; }
  .value.idle .read { color:#b9b4aa; font-weight:500; }
  .sum { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px 10px; font-size:clamp(18px,3.6vw,34px); font-weight:700; min-height:1.6em; }
  .sum span.p { padding:2px 10px; border-radius:10px; background:#fff; border:2px solid var(--line); }
  .sum span.p[data-place="만"] { color:var(--c만); border-color:var(--c만); } .sum span.p[data-place="천"] { color:var(--c천); border-color:var(--c천); }
  .sum span.p[data-place="백"] { color:var(--c백); border-color:var(--c백); } .sum span.p[data-place="십"] { color:var(--c십); border-color:var(--c십); }
  .sum span.p[data-place="일"] { color:var(--c일); border-color:var(--c일); }
  .sum .total { padding:2px 12px; border-radius:10px; background:#232320; color:#efe6d6; }
  .sum .full { width:100%; text-align:center; font-size:.8em; color:var(--muted); font-weight:600; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; font-size:.85em; color:var(--muted); }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  footer { position:fixed; left:0; right:0; bottom:0; padding:8px 16px 10px 120px; font-size:.8em; color:var(--muted); background:linear-gradient(transparent, var(--bg) 40%); text-align:right; }
  @media (max-width:560px) { header h1 { width:100%; } footer { padding-left:16px; text-align:left; padding-bottom:56px; } }
  body:not(.detail) .value, body:not(.detail) .sum { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>자릿값 올려 보기</h1>
  <div class="grp"><label>자릿수</label>
    <select id="digits"><option value="2">2자리</option><option value="3">3자리</option><option value="4" selected>4자리</option><option value="5">5자리</option></select></div>
  <div class="grp"><button class="primary" id="newBtn">새 숫자</button></div>
  <div class="grp"><input type="text" id="typed" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="직접 입력"><button id="setBtn">보기</button></div>
  <div class="grp"><label>크기</label><span class="seg" id="sizeSeg"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button></span><input type="hidden" id="sizeR" value="3"></div>
  <div class="grp"><label>간격</label><button id="gapMinus" title="숫자를 붙여요">◀ 좁게</button><span class="val" id="gapV">0</span><button id="gapPlus" title="숫자를 벌려요">넓게 ▶</button><input type="hidden" id="gapR" value="0"><button id="lookReset" title="크기 3, 간격 0으로">↺</button></div>
  <div class="grp"><button id="zeroBtn" title="0이 든 숫자를 자주 내요">0 섞기</button><button id="soundBtn" class="on">🔊 소리</button><button id="detailBtn" title="한글 읽기와 더하기 식을 아래에 보여 줘요">읽기·식 보기</button><button id="resetBtn">처음부터</button></div>
</header>

<main>
  <p class="hint" id="hint">숫자에 마우스를 올리거나 손가락으로 눌러 보세요. 그 숫자 아래에 자릿값이 나와요.</p>
  <div class="number" id="number"></div>
  <div class="value idle" id="value"><div class="num" id="vnum"></div><div class="read" id="vread">숫자를 짚어 보세요</div></div>
  <div class="sum" id="sum"></div>
  <div class="legend"><span><i style="background:var(--c만)"></i>만</span><span><i style="background:var(--c천)"></i>천</span><span><i style="background:var(--c백)"></i>백</span><span><i style="background:var(--c십)"></i>십</span><span><i style="background:var(--c일)"></i>일</span></div>
</main>
<footer>크기 1~5 · 간격은 −12(붙임)~30(벌림) · 키보드: + − 크기, [ ] 간격, ← → 자리 옮기기, 스페이스 새 숫자 · "읽기·식 보기"를 켜면 한글 읽기와 더하기 식</footer>

<script>
(function(){
  var PLACES = ["만","천","백","십","일"];
  var DIGIT_KO = ["","일","이","삼","사","오","육","칠","팔","구"];
  var $ = function(id){ return document.getElementById(id); };
  var numberEl=$("number"), valueEl=$("value"), vnum=$("vnum"), vread=$("vread"), sumEl=$("sum"), hint=$("hint");
  var state = { digits:[], places:[], visited:[], sound:true, zeroMode:false, active:-1 };

  // 자릿값 읽기: 십의 자리 1 → "십", 백의 자리 1 → "백" (일십·일백 아님). 일의 자리는 "일".
  function readPlace(d, place){
    if (d === 0) return "";
    if (place === "일") return DIGIT_KO[d];
    return (d === 1 ? "" : DIGIT_KO[d]) + place;
  }
  function readNumber(digits, places){
    var s = "";
    for (var i=0;i<digits.length;i++) s += readPlace(digits[i], places[i]);
    return s || "영";
  }
  function placeValue(d, place){ return d * ({"만":10000,"천":1000,"백":100,"십":10,"일":1}[place]); }

  function makeNumber(n){
    var digits = [];
    for (var i=0;i<n;i++){
      var d = Math.floor(Math.random()*10);
      if (i===0 && d===0) d = 1 + Math.floor(Math.random()*9);
      if (state.zeroMode && i>0 && Math.random()<0.5) d = 0;
      digits.push(d);
    }
    if (!state.zeroMode && digits.slice(1).every(function(x){return x===0;})) digits[n-1] = 1 + Math.floor(Math.random()*9);
    return digits;
  }
  function setNumber(digits){
    state.digits = digits; state.places = PLACES.slice(PLACES.length - digits.length);
    state.visited = digits.map(function(){return false;}); state.active = -1;
    numberEl.innerHTML = ""; numberEl.classList.toggle("n5", digits.length >= 5); numberEl.classList.toggle("n3", digits.length <= 3);
    digits.forEach(function(d,i){
      var el = document.createElement("div");
      el.className = "digit" + (d===0 ? " zero" : ""); el.dataset.place = state.places[i]; el.dataset.i = i;
      el.innerHTML = d + '<span class="pv"></span>';
      el.addEventListener("mouseenter", function(){ if (!isTouch) show(i); });
      el.addEventListener("touchstart", function(){ isTouch = true; show(i, true); }, {passive:true});
      el.addEventListener("click", function(e){ e.preventDefault(); show(i, true); });
      numberEl.appendChild(el);
    });
    valueEl.className = "value idle"; vnum.textContent = ""; vread.textContent = "숫자를 짚어 보세요"; sumEl.innerHTML = "";
    hint.textContent = "숫자에 마우스를 올리거나 손가락으로 눌러 보세요. 그 숫자 아래에 자릿값이 나와요.";
    if (typeof fitWidth === "function") fitWidth();
  }
  var isTouch = false;
  window.addEventListener("touchstart", function(){ isTouch = true; }, {passive:true, once:true});

  var lastSpoken = { i:-1, t:0 };
  function show(i, speakAgain){
    var d = state.digits[i], place = state.places[i];
    var dup = (lastSpoken.i === i && Date.now() - lastSpoken.t < 600); lastSpoken = { i:i, t:Date.now() };
    state.active = i;
    Array.prototype.forEach.call(numberEl.children, function(el, k){ el.classList.toggle("active", k===i); if (k===i) el.classList.add("done"); });
    var pv = numberEl.children[i].querySelector(".pv");
    pv.textContent = d === 0 ? "없음" : placeValue(d, place).toLocaleString("ko-KR");
    if (d === 0){
      valueEl.className = "value none"; vnum.textContent = "0"; vread.textContent = place + "의 자리 — 없음";
      if (!dup) speak(place + "의 자리는 없어요");
    } else {
      valueEl.className = "value"; vread.textContent = readPlace(d, place);
      if (!dup) speak(readPlace(d, place));
    }
    state.visited[i] = true;
    if (state.visited.every(Boolean)) showSum();
  }
  function showSum(){
    var parts = [], total = 0;
    state.digits.forEach(function(d,i){ if (d>0){ parts.push('<span class="p" data-place="'+state.places[i]+'">'+placeValue(d,state.places[i]).toLocaleString("ko-KR")+'</span>'); total += placeValue(d,state.places[i]); } });
    var full = readNumber(state.digits, state.places);
    sumEl.innerHTML = parts.join('<span>+</span>') + '<span>=</span><span class="total">' + total.toLocaleString("ko-KR") + '</span><span class="full">' + full + '</span>';
    hint.textContent = document.body.classList.contains("detail") ? "다 짚었어요! 전체를 읽어 볼까요? → " + full : "다 짚었어요!";
  }
  if ("speechSynthesis" in window) { try { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = function(){ window.speechSynthesis.getVoices(); }; } catch(e){} }
  var warmed = false;
  document.addEventListener("pointerdown", function(){ if (warmed || !("speechSynthesis" in window)) return; warmed = true; try { var u = new SpeechSynthesisUtterance(" "); u.lang = "ko-KR"; u.volume = 0; window.speechSynthesis.speak(u); } catch(e){} }, {once:true, passive:true});
  function speak(text){
    if (!state.sound || !("speechSynthesis" in window)) return;
    try { window.speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(text); u.lang = "ko-KR"; u.rate = 0.9; window.speechSynthesis.speak(u); } catch(e){}
  }
  function newNumber(){ setNumber(makeNumber(parseInt($("digits").value,10))); }

  var SCALES = {1:0.6, 2:0.8, 3:1, 4:1.2, 5:1.4};
  function fitWidth(){
    document.documentElement.style.setProperty("--fit", 1);
    var r = numberEl.getBoundingClientRect();
    var availW = window.innerWidth - 24;
    var head = document.querySelector("header").getBoundingClientRect().height;
    var availH = window.innerHeight - head - 70;
    var f = Math.min(1, availW / Math.max(1, r.width), availH / Math.max(1, r.height));
    if (f < 1) document.documentElement.style.setProperty("--fit", f.toFixed(3));
  }
  window.addEventListener("resize", fitWidth);
  function applyLook(){
    var lv = parseInt($("sizeR").value,10), gp = parseInt($("gapR").value,10);
    if (!(lv >= 1 && lv <= 5)) { lv = 3; $("sizeR").value = 3; }
    if (!(gp >= -12 && gp <= 30)) { gp = 0; $("gapR").value = 0; }
    document.documentElement.style.setProperty("--scale", SCALES[lv] || 1);
    document.documentElement.style.setProperty("--gap", (gp/100) + "em");
    Array.prototype.forEach.call(document.querySelectorAll("#sizeSeg button"), function(b){ b.classList.toggle("on", parseInt(b.dataset.v,10)===lv); });
    $("gapV").textContent = gp;
    fitWidth();
    try { localStorage.setItem("pv-look", JSON.stringify({s:lv, g:gp})); } catch(e){}
  }
  try { var saved = JSON.parse(localStorage.getItem("pv-look")||"null"); if (saved){ $("sizeR").value = saved.s; $("gapR").value = saved.g; } } catch(e){}
  Array.prototype.forEach.call(document.querySelectorAll("#sizeSeg button"), function(b){ b.addEventListener("click", function(){ $("sizeR").value = this.dataset.v; applyLook(); }); });
  $("gapMinus").addEventListener("click", function(){ $("gapR").value = Math.max(-12, parseInt($("gapR").value,10)-2); applyLook(); });
  $("gapPlus").addEventListener("click", function(){ $("gapR").value = Math.min(30, parseInt($("gapR").value,10)+2); applyLook(); });
  $("lookReset").addEventListener("click", function(){ $("sizeR").value = 3; $("gapR").value = 0; applyLook(); });
  applyLook();
  $("newBtn").addEventListener("click", newNumber);
  $("digits").addEventListener("change", newNumber);
  $("setBtn").addEventListener("click", function(){
    var v = $("typed").value.replace(/\D/g,"");
    if (!v || v.length>5 || v[0]==="0") { $("typed").focus(); return; }
    setNumber(v.split("").map(Number)); $("typed").value = "";
  });
  $("typed").addEventListener("keydown", function(e){ if (e.key==="Enter") $("setBtn").click(); });
  $("zeroBtn").addEventListener("click", function(){ state.zeroMode = !state.zeroMode; this.classList.toggle("on", state.zeroMode); newNumber(); });
  $("detailBtn").addEventListener("click", function(){ document.body.classList.toggle("detail"); this.classList.toggle("on", document.body.classList.contains("detail")); });
  $("soundBtn").addEventListener("click", function(){ state.sound = !state.sound; this.classList.toggle("on", state.sound); this.textContent = state.sound ? "🔊 소리" : "🔇 소리 없음"; });
  $("resetBtn").addEventListener("click", function(){ setNumber(state.digits.slice()); });
  document.addEventListener("keydown", function(e){
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight") show(Math.min(state.digits.length-1, state.active+1));
    else if (e.key === "ArrowLeft") show(Math.max(0, state.active<0 ? 0 : state.active-1));
    else if (e.key === "Enter" && state.active>=0) show(state.active);
    else if (e.key === " ") { e.preventDefault(); newNumber(); }
    else if (e.key === "+" || e.key === "=") { $("sizeR").value = Math.min(5, parseInt($("sizeR").value,10)+1); applyLook(); }
    else if (e.key === "-") { $("sizeR").value = Math.max(1, parseInt($("sizeR").value,10)-1); applyLook(); }
    else if (e.key === "]") { $("gapR").value = Math.min(30, parseInt($("gapR").value,10)+2); applyLook(); }
    else if (e.key === "[") { $("gapR").value = Math.max(-12, parseInt($("gapR").value,10)-2); applyLook(); }
  });
  newNumber();
})();
</script>

</body>
</html>
