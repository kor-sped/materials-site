<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>획순 따라쓰기 — 자음·모음·글자</title>
<style>
  :root{--ink:#16323D;--ink2:#4A6272;--ink3:#8799A5;--rule:#C6D5DD;--rule2:#E3ECF0;--blue:#1F5D8C;--blue-tint:#E4EFF6;--amber:#BF860F;--amber-tint:#FAF0D9;--bg:#EEF3F6;--red:#B5432F;--green:#2E7D4F;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;min-height:100%;}
  button{font:inherit;cursor:pointer;border:1.5px solid var(--rule);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;}
  button:active{transform:translateY(1px);}
  button.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  .bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--rule);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .bar .tabs{display:flex;gap:6px;}
  .bar .tabs button{font-size:16px;font-weight:700;padding:8px 16px;}
  .bar .wordbox{display:flex;gap:6px;flex:1;min-width:220px;}
  .bar .wordbox[hidden]{display:none;}
  .bar .wordbox input{flex:1;font:inherit;font-size:18px;padding:8px 10px;border:1.5px solid var(--rule);border-radius:10px;min-width:0;}
  .bar .right{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink2);}
  .bar select{font:inherit;padding:6px 8px;border:1.5px solid var(--rule);border-radius:8px;background:#fff;}
  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 12px 24px;gap:10px;}
  .pick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:760px;}
  .pick button{font-size:22px;font-weight:700;min-width:46px;height:46px;padding:0 10px;}
  .pick button.sub{font-size:18px;height:40px;min-width:40px;color:var(--ink2);}
  .pick .sep{flex-basis:100%;height:0;}
  .stage{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;}
  .title{display:flex;align-items:center;gap:10px;font-size:20px;color:var(--ink2);}
  .title #cur{font-size:34px;font-weight:800;color:var(--ink);}
  .title button{padding:4px 10px;font-size:18px;}
  svg#board{width:min(92vw,58vh,560px);height:min(92vw,58vh,560px);background:#fff;border:2px solid var(--rule);border-radius:18px;touch-action:none;box-shadow:0 2px 12px rgba(22,50,61,.08);}
  .ctrl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .ctrl button{font-size:16px;padding:10px 16px;}
  .ctrl button.big{font-weight:700;background:var(--amber-tint);border-color:var(--amber);}
  .msg{min-height:28px;font-size:18px;font-weight:700;color:var(--blue);text-align:center;}
  .msg.bad{color:var(--red);}
  .msg.ok{color:var(--green);}
  .foot{font-size:12px;color:var(--ink3);text-align:center;max-width:560px;line-height:1.5;}
  /* 학습지 (인쇄 전용) */
  #sheet{display:none;}
  @media print{
    body>*:not(#sheet){display:none !important;}
    body{background:#fff;display:block;}
    #sheet{display:block;font-size:11pt;color:#222;}
    #sheet .pg{break-after:page;}
    #sheet .pg:last-child{break-after:auto;}
    #sheet .hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #16323D;padding-bottom:4px;margin-bottom:6mm;}
    #sheet .hd b{font-size:15pt;}
    #sheet .hd span{font-size:10pt;color:#555;}
    #sheet .row{display:grid;grid-template-columns:repeat(7,1fr);gap:1.6mm;margin-bottom:2.2mm;}
    #sheet .cell{aspect-ratio:1/1;border:1px solid #9aa;border-radius:2px;background:#fff;}
    #sheet .cell.model{border:1.5px solid #16323D;}
    #sheet .cell svg{width:100%;height:100%;display:block;}
    @page{size:A4;margin:11mm 12mm;}
  }
</style>
</head>
<body>
<header class="bar">
  <div class="tabs">
    <button data-mode="cons">자음</button>
    <button data-mode="vow">모음</button>
    <button data-mode="word">글자</button>
  </div>
  <div class="wordbox" id="wordbox" hidden>
    <input id="word" placeholder="글자나 낱말을 써요 (예: 나, 우유, 아침)" autocomplete="off">
    <button id="go">보기</button>
  </div>
  <div class="right">
    <label>검사 <select id="ease"><option value="easy">쉽게</option><option value="normal" selected>보통</option><option value="off">안 함</option></select></label>
    <button id="print">🖨 학습지 인쇄</button>
  </div>
</header>
<main>
  <div class="pick" id="pick"></div>
  <div class="stage">
    <div class="title"><span id="cur">ㄱ</span><span id="name">기역</span><button id="say" title="읽어 주기">🔊</button></div>
    <svg id="board" viewBox="0 0 100 100" aria-label="따라 쓰기 판"></svg>
    <div class="ctrl">
      <button id="play" class="big">▶ 획순 보기</button>
      <button id="reset">↺ 다시</button>
      <button id="prev">◀ 앞 글자</button>
      <button id="next">다음 글자 ▶</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="foot">번호 점에서 시작해 움직이는 점을 따라 손가락(마우스)으로 그려요. 획을 다 그리면 파랗게 바뀌고 다음 획으로 넘어가요. 검사 "안 함"이면 마음대로 써 볼 수 있어요. 인쇄를 누르면 지금 고른 글자들의 따라쓰기 학습지가 나와요.</div>
  </div>
</main>
<section id="sheet"></section>

<script>
(function(){
'use strict';
/* ───────────── 획 자료 (100×100 상자, 획마다 점 목록) ───────────── */
function circle(cx,cy,r){const p=[];for(let i=0;i<=36;i++){const a=(-90-i*10)*Math.PI/180;p.push([+(cx+r*Math.cos(a)).toFixed(2),+(cy+r*Math.sin(a)).toFixed(2)]);}return p;}
const C={
 'ㄱ':[[[22,24],[76,24],[76,80]]],
 'ㄴ':[[[24,20],[24,78],[78,78]]],
 'ㄷ':[[[24,22],[78,22]],[[24,22],[24,78],[78,78]]],
 'ㄹ':[[[24,18],[78,18],[78,48]],[[24,48],[78,48]],[[24,48],[24,82],[78,82]]],
 'ㅁ':[[[24,22],[24,78]],[[24,22],[76,22],[76,78]],[[24,78],[76,78]]],
 'ㅂ':[[[24,18],[24,82]],[[76,18],[76,82]],[[24,50],[76,50]],[[24,82],[76,82]]],
 'ㅅ':[[[50,20],[20,84]],[[42,40],[80,84]]],
 'ㅇ':[circle(50,50,29)],
 'ㅈ':[[[22,24],[78,24]],[[50,24],[20,84]],[[42,42],[80,84]]],
 'ㅊ':[[[50,8],[50,20]],[[22,28],[78,28]],[[50,28],[22,86]],[[42,46],[78,86]]],
 'ㅋ':[[[22,22],[76,22],[76,82]],[[22,52],[76,52]]],
 'ㅌ':[[[24,20],[78,20]],[[24,50],[78,50]],[[24,50],[24,82],[78,82]]],
 'ㅍ':[[[20,20],[80,20]],[[34,20],[34,78]],[[66,20],[66,78]],[[20,78],[80,78]]],
 'ㅎ':[[[50,6],[50,18]],[[22,26],[78,26]],circle(50,62,22)],
};
const V={
 'ㅏ':[[[42,12],[42,88]],[[42,50],[74,50]]],
 'ㅑ':[[[42,12],[42,88]],[[42,36],[74,36]],[[42,64],[74,64]]],
 'ㅓ':[[[26,50],[58,50]],[[58,12],[58,88]]],
 'ㅕ':[[[26,36],[58,36]],[[26,64],[58,64]],[[58,12],[58,88]]],
 'ㅗ':[[[50,24],[50,56]],[[14,56],[86,56]]],
 'ㅛ':[[[36,24],[36,56]],[[64,24],[64,56]],[[14,56],[86,56]]],
 'ㅜ':[[[14,42],[86,42]],[[50,42],[50,78]]],
 'ㅠ':[[[14,42],[86,42]],[[36,42],[36,78]],[[64,42],[64,78]]],
 'ㅡ':[[[14,50],[86,50]]],
 'ㅣ':[[[50,12],[50,88]]],
};
/* 겹모음·쌍자음·겹받침: [낱자, 상자(x,y,w,h)] 순서대로 */
const COMBO={
 'ㅐ':[['ㅏ',[0,0,64,100]],['ㅣ',[56,0,44,100]]],
 'ㅒ':[['ㅑ',[0,0,64,100]],['ㅣ',[56,0,44,100]]],
 'ㅔ':[['ㅓ',[0,0,64,100]],['ㅣ',[56,0,44,100]]],
 'ㅖ':[['ㅕ',[0,0,64,100]],['ㅣ',[56,0,44,100]]],
 'ㅘ':[['ㅗ',[0,34,62,66]],['ㅏ',[56,0,44,100]]],
 'ㅙ':[['ㅗ',[0,34,56,66]],['ㅐ',[48,0,52,100]]],
 'ㅚ':[['ㅗ',[0,34,62,66]],['ㅣ',[56,0,44,100]]],
 'ㅝ':[['ㅜ',[0,34,62,66]],['ㅓ',[56,0,44,100]]],
 'ㅞ':[['ㅜ',[0,34,56,66]],['ㅔ',[48,0,52,100]]],
 'ㅟ':[['ㅜ',[0,34,62,66]],['ㅣ',[56,0,44,100]]],
 'ㅢ':[['ㅡ',[0,34,64,66]],['ㅣ',[56,0,44,100]]],
 'ㄲ':[['ㄱ',[0,0,52,100]],['ㄱ',[48,0,52,100]]],
 'ㄸ':[['ㄷ',[0,0,52,100]],['ㄷ',[48,0,52,100]]],
 'ㅃ':[['ㅂ',[0,0,52,100]],['ㅂ',[48,0,52,100]]],
 'ㅆ':[['ㅅ',[0,0,52,100]],['ㅅ',[48,0,52,100]]],
 'ㅉ':[['ㅈ',[0,0,52,100]],['ㅈ',[48,0,52,100]]],
 'ㄳ':[['ㄱ',[0,0,52,100]],['ㅅ',[48,0,52,100]]],
 'ㄵ':[['ㄴ',[0,0,52,100]],['ㅈ',[48,0,52,100]]],
 'ㄶ':[['ㄴ',[0,0,52,100]],['ㅎ',[48,0,52,100]]],
 'ㄺ':[['ㄹ',[0,0,52,100]],['ㄱ',[48,0,52,100]]],
 'ㄻ':[['ㄹ',[0,0,52,100]],['ㅁ',[48,0,52,100]]],
 'ㄼ':[['ㄹ',[0,0,52,100]],['ㅂ',[48,0,52,100]]],
 'ㄽ':[['ㄹ',[0,0,52,100]],['ㅅ',[48,0,52,100]]],
 'ㄾ':[['ㄹ',[0,0,52,100]],['ㅌ',[48,0,52,100]]],
 'ㄿ':[['ㄹ',[0,0,52,100]],['ㅍ',[48,0,52,100]]],
 'ㅀ':[['ㄹ',[0,0,52,100]],['ㅎ',[48,0,52,100]]],
 'ㅄ':[['ㅂ',[0,0,52,100]],['ㅅ',[48,0,52,100]]],
};
const LS='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const VS='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
const TS=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const LAY={ /* [자음 상자, 모음 상자, 받침 상자] — 받침 없음 / 있음 */
 v:[{c:[8,10,42,80],v:[50,5,44,90]},{c:[8,6,42,52],v:[50,3,44,58],t:[20,64,60,32]}],
 h:[{c:[18,6,64,42],v:[8,46,84,46]},{c:[20,4,60,32],v:[8,36,84,30],t:[20,68,60,30]}],
 m:[{c:[8,6,48,40],v:[6,4,88,92]},{c:[8,4,44,32],v:[6,2,88,60],t:[20,66,60,30]}],
};
function place(strokes,b){return strokes.map(s=>s.map(([x,y])=>[b[0]+x*b[2]/100,b[1]+y*b[3]/100]));}
function glyph(ch){
  if(C[ch])return C[ch]; if(V[ch])return V[ch];
  if(COMBO[ch])return COMBO[ch].flatMap(([j,b])=>place(glyph(j),b));
  const code=ch.charCodeAt(0)-0xAC00;
  if(code>=0&&code<11172){
    const l=LS[Math.floor(code/588)],v=VS[Math.floor(code%588/28)],t=TS[code%28];
    const kind='ㅏㅐㅑㅒㅓㅔㅕㅖㅣ'.includes(v)?'v':'ㅗㅛㅜㅠㅡ'.includes(v)?'h':'m';
    const B=LAY[kind][t?1:0];
    return [...place(glyph(l),B.c),...place(glyph(v),B.v),...(t?place(glyph(t),B.t):[])];
  }
  return null;
}
const CN={'ㄱ':'기역','ㄲ':'쌍기역','ㄴ':'니은','ㄷ':'디귿','ㄸ':'쌍디귿','ㄹ':'리을','ㅁ':'미음','ㅂ':'비읍','ㅃ':'쌍비읍','ㅅ':'시옷','ㅆ':'쌍시옷','ㅇ':'이응','ㅈ':'지읒','ㅉ':'쌍지읒','ㅊ':'치읓','ㅋ':'키읔','ㅌ':'티읕','ㅍ':'피읖','ㅎ':'히읗'};
const VN={'ㅏ':'아','ㅐ':'애','ㅑ':'야','ㅒ':'얘','ㅓ':'어','ㅔ':'에','ㅕ':'여','ㅖ':'예','ㅗ':'오','ㅘ':'와','ㅙ':'왜','ㅚ':'외','ㅛ':'요','ㅜ':'우','ㅝ':'워','ㅞ':'웨','ㅟ':'위','ㅠ':'유','ㅡ':'으','ㅢ':'의','ㅣ':'이'};
function nameOf(ch){return CN[ch]||VN[ch]||ch;}
function isHangul(ch){const c=ch.charCodeAt(0);return (c>=0x3131&&c<=0x3163)||(c>=0xAC00&&c<=0xD7A3);}

/* ───────────── 그리기 도우미 ───────────── */
const NS='http://www.w3.org/2000/svg';
function el(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;}
function dOf(pts){return pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(2)+' '+p[1].toFixed(2)).join(' ');}
function unit(a,b){const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy)||1;return [dx/d,dy/d];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function numPos(s){const u=unit(s[0],s[1]);return [clamp(s[0][0]-u[0]*8,6,94),clamp(s[0][1]-u[1]*8,6,94)];}
function arrowD(s){const n=s.length,a=s[n-2],b=s[n-1],u=unit(a,b),l=3.2,w=2.2;
  const tip=b,base=[b[0]-u[0]*l,b[1]-u[1]*l],p=[-u[1],u[0]];
  return `M${tip[0]} ${tip[1]}L${base[0]+p[0]*w} ${base[1]+p[1]*w}L${base[0]-p[0]*w} ${base[1]-p[1]*w}Z`;}
function resample(pts,step){const out=[pts[0]];for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],d=Math.hypot(b[0]-a[0],b[1]-a[1]);for(let s=step;s<d;s+=step)out.push([a[0]+(b[0]-a[0])*s/d,a[1]+(b[1]-a[1])*s/d]);out.push(b);}return out;}
function widthFor(ch){return ch.length===1&&(C[ch]||V[ch]||COMBO[ch])?8.5:6.2;}

/* 인쇄용 SVG 문자열 */
function svgStr(strokes,w,mode){ /* mode: model | trace | blank */
  let s=`<svg viewBox="0 0 100 100" xmlns="${NS}">`;
  if(mode==='blank'){s+=`<path d="M50 4V96M4 50H96" stroke="#dde3e7" stroke-width=".7" stroke-dasharray="2 2"/>`;return s+'</svg>';}
  s+=`<path d="M50 4V96M4 50H96" stroke="#e6ebee" stroke-width=".6" stroke-dasharray="2 2"/>`;
  const col=mode==='model'?'#16323D':'#b7c3cb';
  for(const st of strokes){
    s+=`<path d="${dOf(st)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${mode==='trace'?' stroke-dasharray="3 2.2"':''}/>`;
  }
  strokes.forEach((st,i)=>{
    if(mode==='model'){
      const [x,y]=numPos(st);
      s+=`<circle cx="${x}" cy="${y}" r="4.6" fill="#fff" stroke="#B5432F" stroke-width=".8"/><text x="${x}" y="${y+2.1}" font-size="6" text-anchor="middle" font-weight="700" fill="#B5432F" font-family="sans-serif">${i+1}</text>`;
      s+=`<path d="${arrowD(st)}" fill="#B5432F"/>`;
    }else{
      s+=`<circle cx="${st[0][0]}" cy="${st[0][1]}" r="2.2" fill="#B5432F" opacity=".85"/>`;
    }
  });
  return s+'</svg>';
}

/* ───────────── 상태 ───────────── */
const $=s=>document.querySelector(s);
const board=$('#board'),msg=$('#msg'),pick=$('#pick');
let mode='cons',list=[],idx=0,strokes=[],cur=0,playing=false,drawing=false,ink=[],inkEl=null,pen=null,timer=null;
const CONS=[...'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ'],CONS2=[...'ㄲㄸㅃㅆㅉ'],VOW=[...'ㅏㅑㅓㅕㅗㅛㅜㅠㅡㅣ'],VOW2=[...'ㅐㅒㅔㅖㅘㅙㅚㅝㅞㅟㅢ'];

function setMode(m){
  mode=m;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  $('#wordbox').hidden=m!=='word';
  if(m==='cons'){list=[...CONS,...CONS2];}
  else if(m==='vow'){list=[...VOW,...VOW2];}
  else{const w=[...$('#word').value].filter(isHangul);list=w.length?w:[...'나'];}
  idx=0;try{localStorage.setItem('hs-mode',m);}catch(e){}
  renderPick();load();
}
function renderPick(){
  pick.innerHTML='';
  const add=(ch,sub)=>{const b=document.createElement('button');b.textContent=ch;if(sub)b.className='sub';b.onclick=()=>{idx=list.indexOf(ch);load();};pick.appendChild(b);};
  if(mode==='cons'){CONS.forEach(c=>add(c));pick.appendChild(Object.assign(document.createElement('span'),{className:'sep'}));CONS2.forEach(c=>add(c,true));}
  else if(mode==='vow'){VOW.forEach(c=>add(c));pick.appendChild(Object.assign(document.createElement('span'),{className:'sep'}));VOW2.forEach(c=>add(c,true));}
  else list.forEach(c=>add(c));
  markPick();
}
function markPick(){[...pick.children].forEach(b=>{if(b.tagName==='BUTTON')b.classList.toggle('on',b.textContent===list[idx]&&(mode!=='word'||[...pick.children].filter(x=>x.tagName==='BUTTON').indexOf(b)===idx));});}

function load(){
  const ch=list[idx];strokes=glyph(ch)||[];cur=0;stopPlay();
  $('#cur').textContent=ch;$('#name').textContent=nameOf(ch)===ch?'':nameOf(ch);
  $('#prev').disabled=idx===0;$('#next').disabled=idx>=list.length-1;
  markPick();draw();setMsg('');
  play();
}
function setMsg(t,cls){msg.textContent=t;msg.className='msg'+(cls?' '+cls:'');}

function draw(){
  board.innerHTML='';const w=widthFor(list[idx]);
  board.appendChild(el('path',{d:'M50 3V97M3 50H97',stroke:'#E6EBEE','stroke-width':'.6','stroke-dasharray':'2 2'}));
  const gGuide=el('g',{id:'g-guide'}),gDone=el('g',{id:'g-done'}),gNum=el('g',{id:'g-num'}),gUser=el('g',{id:'g-user'});
  strokes.forEach((s,i)=>{
    gGuide.appendChild(el('path',{d:dOf(s),fill:'none',stroke:i<cur?'#1F5D8C':'#D9E2E8','stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round','data-i':i}));
    gGuide.appendChild(el('path',{d:arrowD(s),fill:i<cur?'#1F5D8C':'#B9C6CE','data-a':i}));
  });
  strokes.forEach((s,i)=>{const [x,y]=numPos(s);const g=el('g',{'data-n':i});
    g.appendChild(el('circle',{cx:x,cy:y,r:4.4,fill:'#fff',stroke:i===cur?'#B5432F':'#C6D5DD','stroke-width':i===cur?1.1:.7}));
    const t=el('text',{x:x,y:y+2.1,'font-size':'5.8','text-anchor':'middle','font-weight':'700',fill:i===cur?'#B5432F':'#8799A5','font-family':'sans-serif'});t.textContent=i+1;g.appendChild(t);gNum.appendChild(g);});
  board.append(gGuide,gDone,gNum,gUser);
  if(cur<strokes.length){const s=strokes[cur];const c=el('circle',{cx:s[0][0],cy:s[0][1],r:3.2,fill:'#BF860F',id:'start'});c.innerHTML='<animate attributeName="r" values="2.6;4.2;2.6" dur="1.1s" repeatCount="indefinite"/>';gNum.appendChild(c);}
}
function paintDone(i){const p=board.querySelector(`[data-i="${i}"]`);if(p)p.setAttribute('stroke','#1F5D8C');const a=board.querySelector(`[data-a="${i}"]`);if(a)a.setAttribute('fill','#1F5D8C');}

/* 획순 애니메이션 */
function stopPlay(){playing=false;if(timer){clearTimeout(timer);timer=null;}board.querySelectorAll('.anim').forEach(e=>e.remove());}
function play(){
  stopPlay();if(!strokes.length)return;playing=true;$('#play').textContent='… 보는 중';
  const w=widthFor(list[idx]);let i=0;
  const step=()=>{
    if(!playing)return;
    board.querySelectorAll('.anim').forEach(e=>e.remove());
    if(i>=strokes.length){playing=false;$('#play').textContent='▶ 획순 보기';setMsg(cur<strokes.length?`①번 점에서 시작해서 따라 써요`:'');draw();return;}
    const s=strokes[i],p=el('path',{d:dOf(s),fill:'none',stroke:'#BF860F','stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round',class:'anim'});
    const dot=el('circle',{r:w*.75,fill:'#B5432F',class:'anim'});
    board.querySelector('#g-num').before(p);board.appendChild(dot);
    const L=p.getTotalLength();p.setAttribute('stroke-dasharray',L);p.setAttribute('stroke-dashoffset',L);
    const dur=Math.max(550,L*16),t0=performance.now();
    const tick=now=>{if(!playing)return;const k=Math.min(1,(now-t0)/dur);p.setAttribute('stroke-dashoffset',L*(1-k));const q=p.getPointAtLength(L*k);dot.setAttribute('cx',q.x);dot.setAttribute('cy',q.y);
      if(k<1)requestAnimationFrame(tick);else{i++;timer=setTimeout(step,380);}};
    requestAnimationFrame(tick);
  };
  step();
}

/* 따라 쓰기 */
function pt(ev){const p=board.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;const q=p.matrixTransform(board.getScreenCTM().inverse());return [q.x,q.y];}
board.addEventListener('pointerdown',ev=>{
  if(playing)stopPlay(),$('#play').textContent='▶ 획순 보기',draw();
  drawing=true;try{board.setPointerCapture(ev.pointerId);}catch(e){}ink=[pt(ev)];
  inkEl=el('path',{d:dOf(ink),fill:'none',stroke:'#1F5D8C','stroke-width':widthFor(list[idx])*.9,'stroke-linecap':'round','stroke-linejoin':'round',opacity:'.85'});
  board.querySelector('#g-user').appendChild(inkEl);ev.preventDefault();
});
board.addEventListener('pointermove',ev=>{if(!drawing||!inkEl)return;ink.push(pt(ev));inkEl.setAttribute('d',dOf(ink));});
function finish(){
  if(!drawing)return;drawing=false;
  const ease=$('#ease').value;
  if(ease==='off'||cur>=strokes.length){return;} /* 자유 쓰기: 잉크를 남긴다 */
  const ok=check(strokes[cur],ink,ease==='easy'?17:12);
  if(ok){inkEl.remove();paintDone(cur);cur++;
    if(cur>=strokes.length){setMsg('🎉 잘했어요! '+list[idx]+(nameOf(list[idx])!==list[idx]?' — '+nameOf(list[idx]):''),'ok');say(nameOf(list[idx]));board.querySelector('#start')?.remove();
      if(mode==='word'&&idx<list.length-1)timer=setTimeout(()=>{idx++;load();},1400);
      else if(mode==='word')setTimeout(()=>say([...$('#word').value].filter(isHangul).join('')),900);
    }else{setMsg(`좋아요! 이제 ${cur+1}번`,'ok');draw();}
  }else{
    const s=strokes[cur],d0=Math.hypot(ink[0][0]-s[0][0],ink[0][1]-s[0][1]);
    setMsg(d0>16?`${cur+1}번 점에서 시작해요`:'끝까지 천천히 따라 그려요','bad');
    inkEl.setAttribute('stroke','#B5432F');const e=inkEl;setTimeout(()=>e.remove(),700);
  }
}
board.addEventListener('pointerup',finish);board.addEventListener('pointercancel',finish);board.addEventListener('pointerleave',()=>{if(drawing)finish();});
function check(stroke,ink,tol){
  if(ink.length<2)return false;
  const S=resample(stroke,2),U=resample(ink,1.5);
  const near=(p,arr,t)=>arr.some(q=>Math.hypot(p[0]-q[0],p[1]-q[1])<t);
  if(Math.hypot(ink[0][0]-stroke[0][0],ink[0][1]-stroke[0][1])>tol*1.4)return false;
  const end=stroke[stroke.length-1],last=ink[ink.length-1];
  if(Math.hypot(last[0]-end[0],last[1]-end[1])>tol*1.6)return false;
  let hit=0;for(const p of S)if(near(p,U,tol))hit++;
  if(hit/S.length<0.8)return false;
  /* 벗어난 잉크가 너무 많으면 실패 (낙서 방지) */
  let off=0;for(const p of U)if(!near(p,S,tol*1.5))off++;
  return off/U.length<0.35;
}

/* 소리 */
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.9;speechSynthesis.speak(u);}catch(e){}}

/* 인쇄 학습지 */
function buildSheet(){
  const chars=[...new Set(list)];const per=8;const sheet=$('#sheet');sheet.innerHTML='';
  const title=mode==='cons'?'자음 획순 따라쓰기':mode==='vow'?'모음 획순 따라쓰기':'글자 획순 따라쓰기 — '+[...$('#word').value].filter(isHangul).join('');
  for(let p=0;p<chars.length;p+=per){
    const pg=document.createElement('div');pg.className='pg';
    pg.innerHTML=`<div class="hd"><b>${title}</b><span>이름 ________ &nbsp; 날짜 ____월 ____일 &nbsp; ${Math.floor(p/per)+1}/${Math.ceil(chars.length/per)}</span></div>`;
    chars.slice(p,p+per).forEach(ch=>{
      const st=glyph(ch)||[],w=widthFor(ch)*.9;
      const row=document.createElement('div');row.className='row';
      row.innerHTML=`<div class="cell model">${svgStr(st,w,'model')}</div>`+`<div class="cell">${svgStr(st,w,'trace')}</div>`.repeat(3)+`<div class="cell">${svgStr(st,w,'blank')}</div>`.repeat(3);
      pg.appendChild(row);
    });
    sheet.appendChild(pg);
  }
}
$('#print').onclick=()=>{buildSheet();setTimeout(()=>window.print(),50);};

/* 단추 */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$('#go').onclick=()=>setMode('word');$('#word').addEventListener('keydown',e=>{if(e.key==='Enter')setMode('word');});
$('#play').onclick=()=>playing?(stopPlay(),$('#play').textContent='▶ 획순 보기',draw()):play();
$('#reset').onclick=()=>{cur=0;stopPlay();$('#play').textContent='▶ 획순 보기';draw();setMsg('1번 점에서 시작해요');};
$('#prev').onclick=()=>{if(idx>0){idx--;load();}};
$('#next').onclick=()=>{if(idx<list.length-1){idx++;load();}};
$('#say').onclick=()=>say(nameOf(list[idx]));
$('#ease').onchange=()=>{try{localStorage.setItem('hs-ease',$('#ease').value);}catch(e){}};
try{const e=localStorage.getItem('hs-ease');if(e)$('#ease').value=e;}catch(e){}
let m0='cons';try{m0=localStorage.getItem('hs-mode')||'cons';}catch(e){}
if(m0==='word')m0='cons';
setMode(m0);
/* 확인용: ?sheet=자음|모음|낱말 → 학습지를 화면에 그대로 보여 준다 */
const q=new URLSearchParams(location.search).get('sheet');
if(q!==null){const v=q||'';if(v==='모음')setMode('vow');else if(v&&v!=='자음'){$('#word').value=v;setMode('word');}buildSheet();const st=document.createElement('style');st.textContent='body>*:not(#sheet){display:none!important}#sheet{display:block;padding:10mm;background:#fff}#sheet .row{display:grid;grid-template-columns:repeat(7,1fr);gap:1.6mm;margin-bottom:2.2mm}#sheet .cell{aspect-ratio:1/1;border:1px solid #9aa}#sheet .cell.model{border:1.5px solid #16323D}#sheet .cell svg{width:100%;height:100%;display:block}#sheet .hd{display:flex;justify-content:space-between;border-bottom:2px solid #16323D;margin-bottom:6mm}';document.head.appendChild(st);}
})();
</script>
