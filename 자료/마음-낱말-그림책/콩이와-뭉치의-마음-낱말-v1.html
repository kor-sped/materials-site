<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>콩이 마음 낱말 책</title>

<style>

  button:focus-visible { outline: 5px solid var(--accent); outline-offset: 3px; }

  .screen { position: fixed; inset: 0; display: none; }

  .toc-top h2 { margin: 0; font-size: clamp(44px, 6vh, 72px); }
  .groups { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 2vh 1.5vw; min-height: 0; }

  details.log button { font-size: 16px; min-height: 36px; }

  .bar button { font-size: inherit; min-height: 6vh; }

  .stars { color: var(--star); font-weight: 800; }

  .word { font-size: clamp(56px, 10vh, 120px); font-weight: 900; letter-spacing: .02em; }

</style></head><body>

<section class="screen on" id="cover">

    <textarea id="log" readonly></textarea> <button id="copy">복사</button></details>
</section>

<section class="screen" id="card">
  <div class="bar">

    <span id="where"></span>
    <span class="stars" id="stars"></span>
    <button id="modeBtn"></button>

  </div>
  <div class="text" id="text"></div>
  <div class="tools" id="tools"></div>
</section>

const VOICE = {"q0": "소리/q0.m4a", "q1": "소리/q1.m4a"};   // 공통 조각: q0 질문, q1 힌트 1 (선생님 목소리)
const GROUPS = [
  ["기쁨", "😊"], ["슬픔", "😢"], ["화", "😠"], ["두려움", "😨"],
  ["놀람", "😲"], ["부끄러움", "😳"], ["지루함", "😑"], ["몸의 느낌", "🧍"],
];
const icon = g => (GROUPS.find(x => x[0] === g) || [, ""])[1];
const $ = id => document.getElementById(id);

let mode = "read";      // read: 읽어요, guess: 맞혀요
let i = 0;              // 지금 카드 번호(0부터)
let hints = 0;          // 맞혀요: 0 질문, 1 얼굴, 2 상황, 3 첫 글자, 4 답
let showSay = false;    // 읽어요: 콩이 말을 보이는지
const stars = {};       // 갈래별 별
const 기록 = [];

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  stopAll();
}

// ── 차례 ──
function drawToc() {
  $("tocTitle").textContent = mode === "read" ? "📖 어떤 마음을 읽을까요?" : "🤔 어떤 마음을 맞혀 볼까요?";
  $("groups").innerHTML = "";
  for (const [g, ic] of GROUPS) {
    const list = CARDS.filter(c => c.group === g);
    const b = document.createElement("button");
    b.innerHTML = `<img src="${list[0].img}" alt=""><span>${ic} ${g} <small>${list.length}장</small></span>`;
    b.onclick = () => go(CARDS.indexOf(list[0]));
    $("groups").appendChild(b);
  }
}

// ── 카드 ──
function go(n) {
  i = Math.max(0, Math.min(CARDS.length - 1, n));
  hints = 0; showSay = false;
  show("card"); draw();
}

function firstLetters(w) {   // 기쁘다 → 기 ◯ ◯
  return [...w].map((ch, k) => k === 0 || ch === " " ? ch : "◯").join("");
}

function draw() {
  const c = CARDS[i];
  const inGroup = CARDS.filter(x => x.group === c.group);
  $("where").textContent = `${icon(c.group)} ${c.group} ${inGroup.indexOf(c) + 1} / ${inGroup.length}`;
  $("stars").textContent = mode === "guess" ? `⭐ ${stars[c.group] || 0}` : "";
  $("modeBtn").textContent = mode === "read" ? "🤔 맞혀요로" : "📖 읽어요로";
  $("pic").src = c.img;
  $("pic").alt = mode === "guess" && hints < 4 ? "콩이와 뭉치 그림" : `콩이와 뭉치가 ${c.haeyo}`;
  $("prev").disabled = i === 0;
  $("next").disabled = i === CARDS.length - 1;

  const T = $("text"), B = $("tools");
  if (mode === "read" || hints >= 4) {
    T.innerHTML = `<div class="word ${hints >= 4 ? "ok" : ""}">${c.word}</div>` +
      (showSay ? `<div class="line say">${c.s2}</div>` : `<div class="line">${c.s1}</div>`);
    B.innerHTML = "";
    B.append(btn("🔊 듣기", speakCard), btn(showSay ? "📝 문장 보기" : "💬 콩이 말", () => { showSay = !showSay; draw(); }));
    if (mode === "guess") B.append(btn("🔁 다시", () => { hints = 0; draw(); }));
  } else {
    const lines = [
      "콩이 마음은 어떨까요?",
      "콩이 얼굴을 봐요. 눈과 입은 어때요?",
      `무슨 일이 있었나요?<div class="line">${c.situation}</div>`,
      `첫 글자는 「${firstLetters(c.word)}」`,
    ];
    T.innerHTML = `<div class="line ${hints ? "hint" : ""}">${hints ? "💡 " : ""}${lines[hints]}</div>`;
    B.innerHTML = "";
    if (hints < 3) B.append(btn(`💡 힌트 ${hints + 1}`, () => { hints++; draw(); }));
    const src = [VOICE.q0, VOICE.q1, c.audio && c.audio.c, c.audio && c.audio.d][hints];
    B.append(btn("🔊 듣기", () => play(src, lines[hints].replace(/<[^>]+>/g, " ").replace(/[「」◯]/g, " "))));
    B.append(btn("🗣 말했어요 ⭐", () => reveal("말했어요")));
    B.append(btn("👀 답 보기", () => reveal("답 보기")));
  }
}

function reveal(how) {
  const c = CARDS[i];
  if (how === "말했어요") stars[c.group] = (stars[c.group] || 0) + 1;
  남기기({ 번호: c.no, 낱말: c.word, 힌트: hints, 어떻게: how });
  hints = 4; draw();
}

function btn(label, fn) {
  const b = document.createElement("button");
  b.textContent = label; b.onclick = fn; return b;
}

// ── 소리 (누를 때만, 자동 재생 없음) ──
// 선생님 목소리 파일이 있으면 그것을, 없거나 안 열리면 브라우저 목소리로 읽는다.
let playing = null;
function stopAll() {
  if (playing) { playing.pause(); playing = null; }
  speechSynthesis.cancel();
  document.querySelectorAll(".speaking").forEach(b => b.classList.remove("speaking"));
}
function play(src, text) {
  const b = document.activeElement;
  stopAll();
  if (!src) return say(text, b);
  const a = new Audio(src); playing = a;
  if (b && b.tagName === "BUTTON") b.classList.add("speaking");
  a.onended = () => b && b.classList.remove("speaking");
  a.onerror = () => { b && b.classList.remove("speaking"); say(text, b); };
  a.play().catch(() => say(text, b));
}
function say(text, el) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ko-KR"; u.rate = 0.85;
  const v = speechSynthesis.getVoices().find(v => v.lang.startsWith("ko"));
  if (v) u.voice = v;
  const b = el || document.activeElement;
  if (b && b.tagName === "BUTTON") { b.classList.add("speaking"); u.onend = u.onerror = () => b.classList.remove("speaking"); }
  speechSynthesis.speak(u);
}
function speakCard() {
  const c = CARDS[i];
  const text = showSay ? c.s2 : `${c.word}. ${c.s1}`;
  play(c.audio && (showSay ? c.audio.b : c.audio.a), text);
}

// ── 기록 ──
function 남기기(항목) {
  기록.push({ ...항목, 모드: mode, 때: new Date().toISOString() });
  $("log").value = JSON.stringify(기록, null, 1);
}
$("copy").onclick = async () => {
  const t = $("log");
  try { await navigator.clipboard.writeText(t.value); } catch { t.select(); document.execCommand("copy"); }
};

// ── 이동 ──
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { mode = b.dataset.mode; drawToc(); show("toc"); });
$("toCover").onclick = () => show("cover");
$("toToc").onclick = () => { drawToc(); show("toc"); };
$("modeBtn").onclick = () => { mode = mode === "read" ? "guess" : "read"; hints = 0; showSay = false; draw(); };
$("prev").onclick = () => go(i - 1);
$("next").onclick = () => go(i + 1);
document.addEventListener("keydown", e => {
  if (!$("card").classList.contains("on")) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") go(i + 1);
  if (e.key === "ArrowLeft" || e.key === "PageUp") go(i - 1);
  if (e.key === "Escape") { drawToc(); show("toc"); }
});
let x0 = null;   // 태블릿 밀기
$("card").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
$("card").addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 80) go(i + (dx < 0 ? 1 : -1));
});
speechSynthesis.getVoices();
</script>
